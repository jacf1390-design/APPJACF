    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="runImport()">Importar</button></div>
  `);
}
function extractNamesFromRows(rows){
  rows = rows.filter(r=>r && r.some(c=>String(c||'').trim()!==''));
  if(!rows.length) return [];
  const bad=/tutor|padre|madre|escuela|curp|grupo|grado|fecha|tel|correo|direcci|folio|matr|turno|sexo|edad/i;
  let hdrIdx=-1, cols=[], bestScore=0;
  for(let i=0;i<Math.min(10,rows.length);i++){
    const idxs=[]; let filled=0;
    rows[i].forEach((c,k)=>{
      const t=String(c||'').trim(); if(t) filled++;
      if(t.length<=40 && /nombre|apellido|alumno/i.test(t) && !bad.test(t)) idxs.push(k);
    });
    const score = idxs.length*10 + (filled>=2?5:0);
    if(idxs.length && score>bestScore){ bestScore=score; hdrIdx=i; cols=idxs; }
  }
  const out=[];
  const okName = n => n.length>2 && !/^\d+$/.test(n) && !/^(no\.?|num|n°|nombre|apellido)/i.test(n);
  if(hdrIdx>=0){
    rows.slice(hdrIdx+1).forEach(r=>{
      const n = cols.map(k=>String(r[k]||'').trim()).filter(Boolean).join(' ');
      if(okName(n)) out.push(n);
    });
  } else {
    rows.forEach(r=>{
      const n = String(r[0]||'').trim();
      if(okName(n)) out.push(n);
    });
  }
  return out;
}
function runImport(){
  const f = document.getElementById('im-file').files[0];
  if(!f){ toast('Elige un archivo primero', 'alert'); return; }
  if(!window.XLSX){ toast('No se pudo cargar el lector de Excel. Revisa tu conexión a internet.', 'alert'); return; }
  const materia = document.getElementById('im-materia').value.trim() || 'Geografía';
  const fbGrado = document.getElementById('im-grado').value;
  const fbGrupo = document.getElementById('im-grupo').value.trim().toUpperCase();
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      let totalAl=0, groups=0;
      wb.SheetNames.forEach(name=>{
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:''});
        const names = extractNamesFromRows(rows);
        if(!names.length) return;
        const m = name.trim().match(/(?:^|[^\dA-Za-z])(\d)\s*[°º\-]?\s*([A-Za-z])(?![A-Za-z])/);
        let grado, grupo;
        if(m){ grado=m[1]+'°'; grupo=m[2].toUpperCase(); }
        else if(wb.SheetNames.length===1 || fbGrupo){ grado=fbGrado; grupo=fbGrupo || name.trim().toUpperCase().slice(0,4); }
        else { grado=''; grupo=name.trim().toUpperCase().slice(0,12); }
        let c = STATE.classes.find(x=>x.grado===grado && x.grupo===grupo && x.materia===materia);
        if(!c) c = createClassObj(grado, grupo, materia);
        totalAl += addStudentsToClass(c, names); groups++;
      });
      saveState(); closeModal();
      if(!groups) toast('No encontré nombres en el archivo. Revisa que haya una columna "Nombre".', 'alert');
      else toast(`Importados ${totalAl} alumnos en ${groups} grupo(s)`, 'success');
      navigate('#/clases'); render();
    }catch(err){ console.error(err); toast('No se pudo leer el archivo', 'alert'); }
  };
  reader.readAsArrayBuffer(f);
}

function faultCounts(studentId){

/* ============================================================
   QR REAL: sincronización (docente) y pantalla del alumno
   Backend: Supabase (solo funciones RPC; las tablas no son públicas)
   ============================================================ */
async function sbRpc(url, key, fn, body){
  const r = await fetch(String(url).replace(/\/+$/,'')+'/rest/v1/rpc/'+fn, {
    method:'POST',
    headers:{'Content-Type':'application/json', apikey:key, Authorization:'Bearer '+key},
    body:JSON.stringify(body||{})
  });
  if(!r.ok){
    let m=''; try{ m=(await r.json()).message||''; }catch(e){}
    const err = new Error(m || ('Error '+r.status)); err.http=r.status; throw err;
  }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
function syncCfg(){ const s=STATE.sync||{}; return (s.url && s.key && s.secret) ? s : null; }
function b64enc(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function b64dec(t){ return JSON.parse(decodeURIComponent(escape(atob(t)))); }

function buildSql(secret){
  const sec = String(secret||'TU-CLAVE-SECRETA').replace(/'/g,"''");
  return `-- JAC Educa · registro de asistencia por QR
-- Pégalo completo en Supabase → SQL Editor → Run (una sola vez).
create table if not exists jac_config (id int primary key default 1 check (id = 1), secret text not null);
create table if not exists jac_sessions (
  session_id text primary key,
  token text unique not null,
  escuela text, clase text, actividad text, instrucciones text, modo text,
  usa_actividad boolean not null default false,
  tolerancia int not null default 10,
  inicio timestamptz not null default now(),
  cerrada boolean not null default false,
  roster jsonb not null default '[]'::jsonb
);
create table if not exists jac_scans (
  session_id text not null references jac_sessions(session_id) on delete cascade,
  student_id text not null,
  student_name text,
  tipo text not null,
  ts timestamptz not null default now(),
  respuesta text,
  entregado_at timestamptz,
  primary key (session_id, student_id)
);
alter table jac_config enable row level security;
alter table jac_sessions enable row level security;
alter table jac_scans enable row level security;
-- Sin políticas: nadie lee ni escribe las tablas directo; todo pasa por las funciones.

insert into jac_config (id, secret) values (1, '${sec}')
  on conflict (id) do update set secret = excluded.secret;

create or replace function jac_check(p_secret text) returns boolean
language sql security definer set search_path = public as $$
  select exists (select 1 from jac_config where id = 1 and secret = p_secret) $$;

create or replace function jac_publish_session(p_secret text, p_session jsonb) returns void
language plpgsql security definer set search_path = public as $$
begin
  if not jac_check(p_secret) then raise exception 'Clave incorrecta'; end if;
  insert into jac_sessions (session_id, token, escuela, clase, actividad, instrucciones, modo, usa_actividad, tolerancia, inicio, cerrada, roster)
  values (p_session->>'session_id', p_session->>'token', p_session->>'escuela', p_session->>'clase',
          p_session->>'actividad', p_session->>'instrucciones', p_session->>'modo',
          coalesce((p_session->>'usa_actividad')::boolean, false), coalesce((p_session->>'tolerancia')::int, 10),
          coalesce((p_session->>'inicio')::timestamptz, now()), false, coalesce(p_session->'roster', '[]'::jsonb))
  on conflict (session_id) do update set token = excluded.token, escuela = excluded.escuela, clase = excluded.clase,
    actividad = excluded.actividad, instrucciones = excluded.instrucciones, modo = excluded.modo,
    usa_actividad = excluded.usa_actividad, tolerancia = excluded.tolerancia, roster = excluded.roster, cerrada = false;
end $$;

create or replace function jac_close_session(p_secret text, p_session_id text) returns void
language plpgsql security definer set search_path = public as $$
begin
  if not jac_check(p_secret) then raise exception 'Clave incorrecta'; end if;
  update jac_sessions set cerrada = true where session_id = p_session_id;
end $$;

create or replace function jac_get_scans(p_secret text, p_session_id text) returns setof jac_scans
language sql security definer set search_path = public as $$
  select * from jac_scans where session_id = p_session_id and jac_check(p_secret) $$;

create or replace function jac_get_session(p_token text) returns jsonb
language sql security definer set search_path = public as $$
  select jsonb_build_object('session_id', session_id, 'escuela', escuela, 'clase', clase, 'actividad', actividad,
    'instrucciones', instrucciones, 'modo', modo, 'usa_actividad', usa_actividad,
    'cerrada', (cerrada or now() > inicio + interval '4 hours'), 'roster', roster)
  from jac_sessions where token = p_token $$;

create or replace function jac_register_scan(p_token text, p_student_id text) returns jsonb
language plpgsql security definer set search_path = public as $$
declare s jac_sessions%rowtype; nm text; t text;
begin
  select * into s from jac_sessions where token = p_token;
  if not found then return jsonb_build_object('status', 'invalido'); end if;
  if s.cerrada or now() > s.inicio + interval '4 hours' then return jsonb_build_object('status', 'cerrada'); end if;
  select e->>'nombre' into nm from jsonb_array_elements(s.roster) e where e->>'id' = p_student_id limit 1;
  if nm is null then return jsonb_build_object('status', 'alumno_invalido'); end if;
  t := case when now() > s.inicio + make_interval(mins => s.tolerancia) then 'retardo' else 'presente' end;
  insert into jac_scans (session_id, student_id, student_name, tipo) values (s.session_id, p_student_id, nm, t)
    on conflict do nothing;
  if not found then return jsonb_build_object('status', 'duplicado'); end if;
  return jsonb_build_object('status', 'ok', 'tipo', t);
end $$;

create or replace function jac_submit(p_token text, p_student_id text, p_respuesta text) returns jsonb
language plpgsql security definer set search_path = public as $$
declare s jac_sessions%rowtype;
begin
  select * into s from jac_sessions where token = p_token;
  if not found then return jsonb_build_object('status', 'invalido'); end if;
  if s.cerrada or now() > s.inicio + interval '4 hours' then return jsonb_build_object('status', 'cerrada'); end if;
  update jac_scans set respuesta = left(coalesce(p_respuesta, ''), 4000), entregado_at = now()
    where session_id = s.session_id and student_id = p_student_id;
  if not found then return jsonb_build_object('status', 'sin_asistencia'); end if;
  return jsonb_build_object('status', 'ok');
end $$;

revoke execute on function jac_check(text) from public, anon, authenticated;
grant execute on function jac_publish_session(text, jsonb), jac_close_session(text, text), jac_get_scans(text, text),
  jac_get_session(text), jac_register_scan(text, text), jac_submit(text, text, text) to anon;
`;
}

async function publishSession(s){
  const cfg = syncCfg(); if(!cfg){ s.synced=false; return; }
  const c = getClass(s.classId); const act = s.activityId ? STATE.activities.find(a=>a.id===s.activityId) : null;
  try{
    await sbRpc(cfg.url, cfg.key, 'jac_publish_session', {p_secret:cfg.secret, p_session:{
      session_id:s.id, token:s.qrToken, escuela:STATE.escuela.nombre, clase:classLabel(c),
      actividad: act?act.titulo:'', instrucciones: act?(act.instrucciones||''):'', modo:s.opciones.modo,
      usa_actividad: !!(act && s.opciones.actividad), tolerancia:s.tolerancia, inicio:s.horaInicio,
      roster:c.alumnos.map(a=>({id:a.id, nombre:a.nombre}))
    }});
    s.synced = true;
  }catch(e){ s.synced=false; s.syncError=e.message; toast('No se pudo conectar el QR: '+e.message,'alert'); }
  saveState();
  if(currentRoute()==='#/sesion/'+s.id) render();
}
async function closeRemoteSession(s){
  const cfg = syncCfg(); if(!cfg || s.synced!==true) return;
  try{ await pullScans(s); await sbRpc(cfg.url, cfg.key, 'jac_close_session', {p_secret:cfg.secret, p_session_id:s.id}); }catch(e){}
}
let sessionPollInt = null;
function startSessionPolling(sessionId){
  if(sessionPollInt){ clearInterval(sessionPollInt); sessionPollInt=null; }
  const s = STATE.sessions.find(x=>x.id===sessionId);
  if(!s || s.cerrada || s.synced!==true) return;
  const tick = async ()=>{
    if(currentRoute()!=='#/sesion/'+sessionId || s.cerrada){ clearInterval(sessionPollInt); sessionPollInt=null; return; }
    try{ if(await pullScans(s)) render(); }catch(e){}
  };
  sessionPollInt = setInterval(tick, 4000); tick();
}
async function pullScans(s){
  const cfg = syncCfg(); if(!cfg) return false;
  const rows = (await sbRpc(cfg.url, cfg.key, 'jac_get_scans', {p_secret:cfg.secret, p_session_id:s.id})) || [];
  const c = getClass(s.classId); let changed=false;
  rows.forEach(r=>{
    if(!c.alumnos.find(a=>a.id===r.student_id)) return;
    if(!STATE.qrScans.find(x=>x.sessionId===s.id && x.studentId===r.student_id)){
      STATE.qrScans.push({sessionId:s.id, studentId:r.student_id, hora:r.ts, tipo:r.tipo});
      s.presentes=(s.presentes||0)+1; if(r.tipo==='retardo') s.retardos=(s.retardos||0)+1;
      markDaily(s.classId, r.student_id, r.tipo==='retardo'?'R':'A', localDate(r.ts), true);
      changed=true; toast(`${r.student_name||'Un alumno'} registró su asistencia`,'success');
    }
    if(s.activityId && r.respuesta){
      let sub = submissionFor(s.activityId, r.student_id);
      if(!sub){
        STATE.submissions.push({id:uid('sub'), activityId:s.activityId, studentId:r.student_id, estado:'Entregada', entregaFecha:r.entregado_at||new Date().toISOString(), respuesta:r.respuesta});
        ensureGradeRow(s.activityId, r.student_id); changed=true;
      } else if(sub.respuesta!==r.respuesta){ sub.respuesta=r.respuesta; sub.entregaFecha=r.entregado_at||sub.entregaFecha; changed=true; }
    }
  });
  if(changed) saveState();
  return changed;
}

function renderStudent(){

        <div style="font-weight:700; margin-top:4px;">${pend?'Guardado en tu celular':(reg.tipo==='retardo'?'Asistencia registrada (retardo)':'Asistencia registrada')}</div>
        <div style="font-size:13px; margin-top:2px;">${escapeHtml(reg.nombre)}</div>
        ${pend?'<div style="font-size:12px; margin-top:6px;">Sin conexión: se enviará automáticamente cuando vuelva el internet.</div>':''}
        ${STU.flash?`<div style="font-size:12.5px; margin-top:6px;">${escapeHtml(STU.flash)}</div>`:''}
      </div>`;
      if(ses.usa_actividad && !pend){
        inner += `<div class="card" style="margin-bottom:10px;">
          <div class="small-muted" style="font-weight:600;">ACTIVIDAD</div>
          <div style="font-weight:700; margin:4px 0 6px;">${escapeHtml(ses.actividad||'Actividad de la sesión')}</div>
          ${ses.instrucciones?`<div style="font-size:13.5px; white-space:pre-wrap; margin-bottom:10px;">${escapeHtml(ses.instrucciones)}</div>`:''}
          ${ses.cerrada?'<div class="small-muted">La sesión ya cerró; ya no se reciben entregas.</div>':`
          <textarea id="stu-resp" rows="6" placeholder="Escribe aquí tu respuesta…" style="${inp}">${escapeHtml(reg.draft||'')}</textarea>
          <button class="btn btn-accent btn-block" style="margin-top:10px;" ${STU.busy?'disabled':''} onclick="stuSubmit()">${reg.entregado?'Reenviar entrega':'Enviar entrega'}</button>
          ${reg.entregado?'<div class="small-muted" style="margin-top:8px; text-align:center;">✅ Entrega enviada. Puedes corregirla y reenviarla mientras la sesión esté abierta.</div>':''}`}
        </div>`;
      }
    } else if(ses.cerrada){
      inner = top + stuCard('🔒','La sesión ya cerró','Ya no se puede registrar asistencia con este QR.');
    } else if(STU.sel){
      const al = (ses.roster||[]).find(a=>a.id===STU.sel);
      inner = top + `<div style="text-align:center; padding:10px 0 16px;"><div class="small-muted">¿Eres tú?</div><div style="font-family:var(--font-display); font-size:21px; font-weight:600; margin:6px 0;">${escapeHtml(al?al.nombre:'')}</div><div class="small-muted" style="font-size:12.5px;">Solo puedes registrar tu asistencia una vez desde este celular.</div></div>

function stuListHtml(list){
  if(!list.length) return '<div class="small-muted" style="text-align:center; padding:16px;">No encontré ese nombre. Revisa cómo lo escribiste.</div>';
  return list.map(a=>`<button onclick="stuPick('${escapeHtml(a.id)}')" style="display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:6px; border:1px solid var(--line); border-radius:10px; background:var(--paper-0); color:var(--ink-900); font-size:14.5px;">${escapeHtml(a.nombre)}</button>`).join('');
}
function stuFilter(v){
  STU.q = v;
  const q = v.trim().toLowerCase();
  const list = (STU.ses.roster||[]).filter(a=>!q || a.nombre.toLowerCase().includes(q));
  document.getElementById('stu-list').innerHTML = stuListHtml(list);
}
function stuPick(id){ STU.sel=id; renderStudent(); }
function stuBack(){ STU.sel=null; renderStudent(); }
async function stuRegister(){
  const al = (STU.ses.roster||[]).find(a=>a.id===STU.sel); if(!al) return;
  STU.busy=true; renderStudent();
  try{
    const r = await sbRpc(STU.cfg.u, STU.cfg.k, 'jac_register_scan', {p_token:STU.token, p_student_id:al.id});
    STU.busy=false;
    if(r.status==='ok'||r.status==='duplicado'){
      STU.reg = {studentId:al.id, nombre:al.nombre, tipo:r.tipo||'presente', pending:false, entregado:false};
      STU.flash = r.status==='duplicado' ? 'Tu asistencia ya está registrada.' : '';
      stuSaveReg(); STU.sel=null;
    } else if(r.status==='cerrada'){ STU.ses.cerrada=true; STU.sel=null; }
    else { STU.error='Este QR ya no es válido. Pídele a tu maestro que lo muestre de nuevo.'; STU.sel=null; }
  }catch(e){
    STU.busy=false;
    if(e instanceof TypeError){
      const q=stuQueue(); q.push({token:STU.token, cfg:STU.cfg, fn:'jac_register_scan', body:{p_token:STU.token, p_student_id:al.id}, kind:'reg'}); stuSaveQueue(q);
      STU.reg = {studentId:al.id, nombre:al.nombre, tipo:'presente', pending:true, entregado:false}; stuSaveReg(); STU.sel=null;
    } else { STU.flash='No se pudo registrar: '+e.message; }
  }
  renderStudent();
}
async function stuSubmit(){
  const ta = document.getElementById('stu-resp'); const txt = (ta?ta.value:'').trim();
  if(!txt){ STU.flash='Escribe tu respuesta antes de enviar.'; renderStudent(); return; }
  STU.reg.draft = txt; STU.busy=true; renderStudent();
  try{
    const r = await sbRpc(STU.cfg.u, STU.cfg.k, 'jac_submit', {p_token:STU.token, p_student_id:STU.reg.studentId, p_respuesta:txt});
    STU.busy=false;
    if(r.status==='ok'){ STU.reg.entregado=true; STU.flash=''; stuSaveReg(); }
    else if(r.status==='cerrada'){ STU.ses.cerrada=true; }
    else STU.flash='No se pudo enviar ('+r.status+').';
  }catch(e){
    STU.busy=false;
    if(e instanceof TypeError){
      const q=stuQueue().filter(x=>!(x.kind==='sub' && x.token===STU.token)); q.push({token:STU.token, cfg:STU.cfg, fn:'jac_submit', body:{p_token:STU.token, p_student_id:STU.reg.studentId, p_respuesta:txt}, kind:'sub'}); stuSaveQueue(q);
      STU.flash='Sin conexión: tu respuesta se enviará cuando vuelva el internet.'; stuSaveReg();
    } else STU.flash='No se pudo enviar: '+e.message;
  }
  renderStudent();
}
async function stuFlush(){
  const q = stuQueue(); if(!q.length) return;
  const rest=[];
  for(const it of q){
    try{
      const r = await sbRpc(it.cfg.u, it.cfg.k, it.fn, it.body);
      if(it.token===STU.token && STU.reg){
        if(it.kind==='reg'){ STU.reg.pending=false; STU.reg.tipo=r.tipo||STU.reg.tipo; STU.flash = r.status==='duplicado'?'Tu asistencia ya está registrada.':''; }
        if(it.kind==='sub'){ STU.reg.entregado = (r.status==='ok'); STU.flash=''; }
        stuSaveReg();
      }
    }catch(e){ if(e instanceof TypeError) rest.push(it); }
  }
  stuSaveQueue(rest); renderStudent();
}

function parseStudentQr(text){

}

function qrDataUrl(text, size){
  const div = document.createElement('div');
  div.style.cssText = 'position:absolute; left:-9999px; top:0;';
  document.body.appendChild(div);
  let url = '';
  try{
    new QRCode(div, {text, width:size, height:size, colorDark:'#000000', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
    const cv = div.querySelector('canvas'); url = cv ? cv.toDataURL('image/png') : '';
    if(!url){ const im=div.querySelector('img'); url = im ? im.src : ''; }
  }catch(e){}
  div.remove();
  return url;
}

/* ---- Escáner ---- */
const SCAN = {stream:null, timer:null, mode:null, id:null, busy:false, pause:false, last:{}, log:[], detector:null, reviewStudent:null};
function beep(ok){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; const c = new AC();
    const o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination);
    o.frequency.value = ok?880:220; g.gain.value = .08; o.start(); setTimeout(()=>{ try{o.stop(); c.close();}catch(e){} }, ok?120:260);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(ok?60:[80,60,80]); }catch(e){}
}
function scanFlash(msg, kind){
  const el = document.getElementById('sc-msg'); if(!el) return;
  const colors = {ok:['#1f9d63','#fff'], warn:['#b4700e','#fff'], alert:['#c13f3f','#fff']};
  const [bg,fg] = colors[kind||'ok'];
  el.style.background = bg; el.style.color = fg; el.textContent = msg;
  beep(kind==='ok');
}
async function openScanner(mode, id){
  closeScanner(true);
  SCAN.mode=mode; SCAN.id=id; SCAN.log=[]; SCAN.last={}; SCAN.busy=false; SCAN.pause=false; SCAN.reviewStudent=null;
  let title = '';
  if(mode==='asistencia'){ const s=STATE.sessions.find(x=>x.id===id); title = 'Pase de lista · '+classLabel(getClass(s.classId)); }
  else { const a=STATE.activities.find(x=>x.id===id); title = 'Revisar: '+a.titulo+' · '+classLabel(getClass(a.classId)); }
  const root = document.createElement('div'); root.id='scanner-root';
  root.innerHTML = `
    <div class="sc-top"><div class="sc-title">${escapeHtml(title)}</div><button class="sc-close" onclick="closeScanner()">Terminar ✕</button></div>
    <div class="sc-stage">
      <video id="sc-video" autoplay playsinline muted></video>
      <canvas id="sc-canvas" style="display:none"></canvas>
      <div class="sc-reticle"></div>
    </div>
    <div class="sc-bottom">
      <div id="sc-msg" class="sc-msg" style="background:#2a2050; color:#fff;">Apunta la cámara a la tarjeta del alumno</div>
      <div id="sc-count" class="sc-count"></div>
      <div id="sc-log" class="sc-log"></div>
      <div id="sc-review" style="display:none;"></div>
    </div>`;
  document.body.appendChild(root);
  updateScanCount();
  try{
    SCAN.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    const v = document.getElementById('sc-video'); v.srcObject = SCAN.stream; await v.play();
  }catch(e){
    const el = document.getElementById('sc-msg');
    if(el){ el.style.background='#c13f3f'; el.textContent='No pude abrir la cámara. Permite el acceso a la cámara en tu navegador (la app debe abrirse con https).'; }
    return;
  }
  if('BarcodeDetector' in window){ try{ SCAN.detector = new BarcodeDetector({formats:['qr_code']}); }catch(e){ SCAN.detector=null; } }
  SCAN.timer = setInterval(scanTick, 170);
}
async function scanTick(){
  if(SCAN.busy || SCAN.pause) return;
  const v = document.getElementById('sc-video'); if(!v || v.readyState<2 || !v.videoWidth) return;
  SCAN.busy = true;
  try{
    let text = null;
    if(SCAN.detector){
      try{ const r = await SCAN.detector.detect(v); if(r.length) text = r[0].rawValue; }
      catch(e){ SCAN.detector = null; }
    }
    if(!SCAN.detector && !text && window.jsQR){
      const cv = document.getElementById('sc-canvas');
      const w = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight*w/v.videoWidth);
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d', {willReadFrequently:true}); ctx.drawImage(v,0,0,w,h);
      const q = jsQR(ctx.getImageData(0,0,w,h).data, w, h, {inversionAttempts:'dontInvert'});
      if(q) text = q.data;
    }
    if(text) handleScan(text);
  }catch(e){}
  SCAN.busy = false;
}
function closeScanner(silent){
  if(SCAN.timer){ clearInterval(SCAN.timer); SCAN.timer=null; }
  if(SCAN.stream){ SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }
  const root = document.getElementById('scanner-root'); if(root) root.remove();
  SCAN.pause=false;
  if(!silent){ saveState(); render(); }
}
function updateScanCount(){
  const el = document.getElementById('sc-count'); if(!el) return;
  if(SCAN.mode==='asistencia'){
    const s = STATE.sessions.find(x=>x.id===SCAN.id); const c = getClass(s.classId);
    el.textContent = `Presentes: ${s.presentes||0} de ${c.alumnos.length}`;
  } else {
    const a = STATE.activities.find(x=>x.id===SCAN.id); const c = getClass(a.classId);
    const n = c.alumnos.filter(al=>{ const g=gradeFor(a.id,al.id); return g && g.valor!==null; }).length;
    el.textContent = `Calificados: ${n} de ${c.alumnos.length}`;
  }
  const lg = document.getElementById('sc-log');
  if(lg) lg.innerHTML = SCAN.log.slice(0,4).map(t=>`<div>${escapeHtml(t)}</div>`).join('');
}
function handleScan(text){
  const now = Date.now();
  if(SCAN.last[text] && now-SCAN.last[text] < 2500) return;
  SCAN.last[text] = now;
  const p = parseStudentQr(text);
  if(!p){ scanFlash('Ese QR no es una tarjeta de alumno de JAC Educa','alert'); return; }
  if(p.school !== getSchoolsMeta().activeId){ scanFlash('Esa tarjeta es de otra escuela. Cambia la escuela activa en el menú.','alert'); return; }
  const f = findStudentGlobal(p.studentId);
  if(!f){ scanFlash('No encuentro a ese alumno (¿lo eliminaste de la clase?)','alert'); return; }
  if(SCAN.mode==='asistencia') scanAttendance(f); else scanReview(f);
}
function scanAttendance(f){
  const s = STATE.sessions.find(x=>x.id===SCAN.id);
  if(s.cerrada){ scanFlash('La sesión ya está cerrada','alert'); return; }
  if(f.c.id !== s.classId){ scanFlash(`${f.a.nombre} no es de este grupo (${classLabel(f.c)})`,'alert'); return; }
  const ya = STATE.qrScans.find(x=>x.sessionId===s.id && x.studentId===f.a.id);
  if(ya){ scanFlash(`Ya estaba registrado: ${f.a.nombre}`,'warn'); return; }
  const sc = registerAttendance(s.id, f.a.id, false, true);
  saveState();
  scanFlash(`✓ ${f.a.nombre} · ${sc.tipo==='retardo'?'Retardo':'Presente'}`, 'ok');
  SCAN.log.unshift(`${fmtTime(sc.hora)} · ${f.a.nombre}${sc.tipo==='retardo'?' (retardo)':''}`);
  updateScanCount();
}
function scanReview(f){
  const a = STATE.activities.find(x=>x.id===SCAN.id);
  if(f.c.id !== a.classId){ scanFlash(`${f.a.nombre} no es de este grupo (${classLabel(f.c)})`,'alert'); return; }
  SCAN.pause = true; SCAN.reviewStudent = f.a.id;
  const g = gradeFor(a.id, f.a.id);
  const rv = document.getElementById('sc-review'); if(!rv) return;
  beep(true);
  rv.style.display = 'block';
  rv.innerHTML = `
    <div class="sc-rv-name">${escapeHtml(f.a.nombre)}</div>
    <div class="sc-rv-chips">${[6,7,8,9,10].map(n=>`<button onclick="saveScanReview(${n})">${n}</button>`).join('')}</div>
    <div class="sc-rv-row">
      <input id="sc-grade" type="number" inputmode="decimal" min="0" max="10" step="0.1" placeholder="0 a 10" value="${g && g.valor!==null ? g.valor : ''}">
      <input id="sc-comment" placeholder="Comentario (opcional)" value="${escapeHtml(g?g.comentario||'':'')}">
    </div>
    <div class="sc-rv-row"><button class="sc-btn-main" onclick="saveScanReview()">Guardar y siguiente</button><button class="sc-btn-alt" onclick="skipScanReview()">Omitir</button></div>`;
}
function saveScanReview(quick){
  const a = STATE.activities.find(x=>x.id===SCAN.id); const sid = SCAN.reviewStudent;
  const raw = quick!==undefined ? String(quick) : document.getElementById('sc-grade').value;
  const n = parseFloat(raw);
  if(raw==='' || isNaN(n) || n<0 || n>10){ toast('Escribe una calificación de 0 a 10','alert'); return; }
  const comment = (document.getElementById('sc-comment')||{}).value || '';
  saveGradeValue(a.id, sid, n, comment);
  const al = findStudentGlobal(sid).a;
  SCAN.log.unshift(`${al.nombre} · ${roundGrade(n)}`);
  skipScanReview(true);
  scanFlash(`✓ ${al.nombre} · ${roundGrade(n)}`, 'ok');
}
function skipScanReview(done){
  SCAN.pause=false; SCAN.reviewStudent=null;
  const rv = document.getElementById('sc-review'); if(rv){ rv.style.display='none'; rv.innerHTML=''; }
  updateScanCount();
}
function saveGradeValue(activityId, studentId, raw, comment){
  const g = ensureGradeRow(activityId, studentId);
  const v = clampGrade(roundGrade(raw));
  if(g.valor !== v) g.historial.push({anterior:g.valor, nuevo:v, usuario:STATE.docente.nombre, fecha:new Date().toISOString()});
  g.valor = v; g.actualizadoEn = new Date().toISOString();
  if(comment !== undefined && comment !== '') g.comentario = comment;
  let sub = submissionFor(activityId, studentId);
  if(!sub){ sub = {id:uid('sub'), activityId, studentId, estado:'Revisada', entregaFecha:new Date().toISOString()}; STATE.submissions.push(sub); }
  else sub.estado = 'Revisada';
  saveState();
}

const NAV_TOP = ['#/inicio','#/clases','#/horarios','#/pizarron'];
const NAV_GROUPS = [
  {id:'aula', label:'Aula', icon:'🏫', routes:['#/asistencia','#/tareas','#/actividades','#/bitacora','#/reconocimientos']},
  {id:'eval', label:'Evaluación', icon:'🧪', routes:['#/evaluaciones','#/banco','#/calificaciones','#/analitica']},
  {id:'seg',  label:'Seguimiento', icon:'🔎', routes:['#/monitor','#/convivencia','#/proyectos','#/equipos']},
  {id:'esc',  label:'Control escolar', icon:'🛡️', routes:['#/grupos','#/alumnos','#/codigos','#/calendario','#/incidencias','#/justificantes','#/visor','#/directorio','#/acomodo','#/expediente','#/escuela']},
  {id:'com',  label:'Comunidad', icon:'💬', routes:['#/avisos','#/comunidad','#/mensajes']},
  {id:'doc',  label:'Informes y documentos', icon:'📄', routes:['#/reportes','#/documentos']},
];
function routeInfo(hash){ return ROUTES.find(r=>r.hash===hash); }
function isRouteActive(hash, route){
  return route===hash || (hash==='#/clases' && route.startsWith('#/clase/')) || (hash==='#/incidencias' && route==='#/reporte-nuevo');
}
function sideLink(r, route, sub){
  const active = isRouteActive(r.hash, route);
  return `<a class="side-link ${sub?'sub':''} ${active?'active':''}" href="${r.hash}" title="${escapeHtml(r.label)}"><span class="nav-ic">${r.icon}</span><span class="nav-text">${r.label}</span></a>`;
}
function userShortName(){
  const p = (STATE.docente.nombre||'').split(' ');
  return (p[0]||'')+(p[1]?' '+p[1][0]+'.':'');
}
function renderSidebar(){
  const el = document.getElementById('sidebar');
  const route = currentRoute();
  document.getElementById('app-shell').classList.toggle('nav-collapsed', !!STATE.navCollapsed);
  const open = STATE.navOpen || {};
  let html = `<div class="side-head">${LOGO_SVG}<span class="word">JAC <b>Educa</b></span><button class="side-collapse" onclick="toggleSidebar()" title="Contraer o expandir menú">${STATE.navCollapsed?'›':'‹'}</button></div>`;
  html += `<div class="school-chip" onclick="openSchoolsModal()" title="Cambiar de escuela"><span class="sc-ic">🎓</span><div class="sc-tx"><div class="lbl">ESCUELA ACTIVA</div><div class="val">${escapeHtml(STATE.escuela.nombre.replace('Escuela ',''))}</div></div><span class="nav-chev">⇅</span></div>`;
  html += `<div class="cycle-chip" onclick="openCicloModal()"><span>Ciclo ${STATE.escuela.ciclo}</span><span>▾</span></div>`;
  html += `<nav class="side-nav">`;
  NAV_TOP.forEach(h=>{ html += sideLink(routeInfo(h), route); });
  html += `<div class="side-group-label">GESTIÓN</div>`;
  NAV_GROUPS.forEach(g=>{
    const hasActive = g.routes.some(h=>isRouteActive(h,route));
    const isOpen = open[g.id]===true || (open[g.id]===undefined && hasActive);
    html += `<div class="nav-group">
      <button class="nav-group-btn ${hasActive?'has-active':''}" onclick="toggleNavGroup('${g.id}')" title="${escapeHtml(g.label)}"><span class="nav-ic">${g.icon}</span><span class="nav-text">${g.label}</span><span class="nav-chev">${isOpen?'▴':'▾'}</span></button>
      <div class="nav-sub ${isOpen?'open':''}">${g.routes.map(h=>sideLink(routeInfo(h), route, true)).join('')}</div>
    </div>`;
  });
  html += `<div class="side-group-label">SISTEMA</div>`;
  html += sideLink(routeInfo('#/configuracion'), route);
  html += `</nav>`;
  const mail = (STATE.docente.correo||'').split('@')[0];
  html += `<div class="user-menu" id="user-menu">
      <button onclick="toggleTheme()"><span>${STATE.theme==='dark'?'☀️':'🌙'}</span> Cambiar tema</button>
      <a href="#/configuracion"><span>⚙️</span> Configuración</a>
      <button onclick="logout()"><span>⏻</span> Cerrar sesión</button>
    </div>
    <div class="side-foot" onclick="toggleUserMenu(event)">
      <div class="av-wrap"><div class="avatar">${STATE.docente.iniciales}</div><span class="dot-online"></span></div>
      <div class="who"><div class="nm">${escapeHtml(userShortName())}</div><div class="rl">⚡ En línea${mail?' · '+escapeHtml(mail):''}</div></div>
      <span class="nav-chev">⌃</span>
    </div>`;
  el.innerHTML = html;
}
function toggleSidebar(){
  STATE.navCollapsed = !STATE.navCollapsed; saveState();
  document.getElementById('app-shell').classList.toggle('nav-collapsed', !!STATE.navCollapsed);
  renderSidebar();
}
function toggleNavGroup(id){
  if(STATE.navCollapsed){ STATE.navCollapsed=false; if(!STATE.navOpen) STATE.navOpen={}; STATE.navOpen[id]=true; saveState(); renderSidebar(); return; }
  if(!STATE.navOpen) STATE.navOpen={};
  const g = NAV_GROUPS.find(x=>x.id===id); const route=currentRoute();
  const cur = STATE.navOpen[id]===true || (STATE.navOpen[id]===undefined && g.routes.some(h=>isRouteActive(h,route)));
  STATE.navOpen[id] = !cur; saveState(); renderSidebar();
}
function toggleUserMenu(ev){
  if(ev) ev.stopPropagation();
  const m = document.getElementById('user-menu'); if(m) m.classList.toggle('open');
}
document.addEventListener('click', (e)=>{
  const m = document.getElementById('user-menu');
  if(m && m.classList.contains('open') && !e.target.closest('.side-foot') && !e.target.closest('.user-menu')) m.classList.remove('open');
});

  saveState();

const MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
function fmtReportDate(iso){
  const d = new Date(iso); const p = n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}/${MESES_CORTOS[d.getMonth()]}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function incFaltas(i){
  if(i.faltas && i.faltas.length) return i.faltas.map(f=>f.texto);
  return [i.faltaTexto || i.categoria || 'Incidencia'];
}

function createReporte(){
  const R = RPT; if(!R) return;
  if(!R.classId){ toast('Selecciona un grupo','alert'); return; }
  if(!R.students.length){ toast('Elige al menos un alumno','alert'); return; }
  const A = STATE.aec, faltas = [];
  R.leves.slice().sort((a,b)=>a-b).forEach(i=>faltas.push({nivel:'leve', texto:A.faltas.leve[i]}));
  if(R.moderada!=='') faltas.push({nivel:'moderada', texto:A.faltas.moderada[Number(R.moderada)]});
  if(R.grave!=='') faltas.push({nivel:'grave', texto:A.faltas.grave[Number(R.grave)]});
  if(R.otro){

}

/* ============================================================
   ASISTENCIA DIARIA: A (asistencia), F (falta), J (justificada), R (retardo)
   Se alimenta a mano, con el QR de sesión o con las tarjetas QR.
   ============================================================ */
function pad2(n){ return String(n).padStart(2,'0'); }
function localDate(v){
  const d = v ? new Date(v) : new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function dateLabel(ds){
  return new Date(ds+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
function shiftDate(ds, delta){
  const d = new Date(ds+'T12:00:00'); d.setDate(d.getDate()+delta); return localDate(d);
}
function dailyRecords(classId){ return (STATE.asistencia||{})[classId] || {}; }
function dayRecord(classId, date, studentId){ const d=dailyRecords(classId)[date]; return d ? d[studentId] : undefined; }
function markDaily(classId, studentId, code, date, onlyIfEmpty){
  if(!STATE.asistencia) STATE.asistencia = {};
  const cl = STATE.asistencia[classId] = STATE.asistencia[classId] || {};
  const day = cl[date] = cl[date] || {};
  if(onlyIfEmpty && day[studentId]) return false;
  const nota = day[studentId] ? day[studentId].nota : '';
  if(code===null){ delete day[studentId]; if(!Object.keys(day).length) delete cl[date]; }
  else day[studentId] = {s:code, nota:nota||''};
  return true;
}
function studentAttendanceCounts(classId, studentId){
  const r = {A:0,F:0,J:0,R:0};
  Object.values(dailyRecords(classId)).forEach(day=>{ const x=day[studentId]; if(x) r[x.s]++; });
  return r;
}
function studentAttendanceRate(classId, studentId){
  const {A,F,R} = studentAttendanceCounts(classId, studentId);
  const base = A+F+R;
  return base ? Math.round((A+R)/base*100) : null;
}
function dayCounts(classId, date){
  const c = getClass(classId); const r = {A:0,F:0,J:0,R:0,sin:0};
  c.alumnos.forEach(a=>{ const x=dayRecord(classId,date,a.id); if(x) r[x.s]++; else r.sin++; });
  return r;
}
function classAttendanceAvg(classId){
  const days = Object.keys(dailyRecords(classId)); if(!days.length) return null;
  const c = getClass(classId); let sum=0, n=0;
  days.forEach(d=>{ const k=dayCounts(classId,d); const tot=k.A+k.F+k.J+k.R; if(tot){ sum += k.A/tot*100; n++; } });
  return n ? Math.round(sum/n) : null;
}

  asisPill('Guardando…'); saveState(); setTimeout(()=>asisPill('✓ Guardado'), 350);
}
function asisSet(studentId, code){
  const cur = dayRecord(ASIS.classId, ASIS.date, studentId);
  markDaily(ASIS.classId, studentId, (cur && cur.s===code) ? null : code, ASIS.date, false);
  asisRefresh();
}
function asisAllPresent(){
  const c = getClass(ASIS.classId); let n=0;
  c.alumnos.forEach(a=>{ if(markDaily(c.id, a.id, 'A', ASIS.date, true)) n++; });
  asisRefresh(); toast(n? `${n} alumno(s) marcados presentes` : 'Todos ya tenían registro');
}
function asisClearDay(){
  askConfirm('¿Borrar todas las marcas de este día?', ()=>{
    const cl = (STATE.asistencia||{})[ASIS.classId]; if(cl) delete cl[ASIS.date];
    saveState(); render(); toast('Día limpiado');
  }, 'Sí, borrar');
}
function asisSetDate(v){ if(!v) return; navigate(`#/asistencia?clase=${ASIS.classId}&fecha=${v}`); }
function asisMoveDay(delta){ asisSetDate(shiftDate(ASIS.date, delta)); }
function openAsisNote(studentId){
  const a = getStudent(ASIS.classId, studentId); const r = dayRecord(ASIS.classId, ASIS.date, studentId);
  openModal(`
    <div class="modal-head"><h3>Nota · ${escapeHtml(a.nombre)}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="small-muted" style="margin-bottom:8px;">${dateLabel(ASIS.date)}${r?'':' · primero marca A, F, J o R'}</div>
      <textarea id="asis-note-txt" rows="3" placeholder="Motivo (ej. cita médica, llegó 10 min tarde…)" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--paper-50); color:var(--ink-900);">${escapeHtml(r?r.nota||'':'')}</textarea>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveAsisNote('${studentId}')">Guardar nota</button></div>`);
}
function saveAsisNote(studentId){
  const txt = (document.getElementById('asis-note-txt').value||'').trim();
  const r = dayRecord(ASIS.classId, ASIS.date, studentId);
  if(!r){ toast('Primero marca A, F, J o R','alert'); return; }
  r.nota = txt; closeModal(); asisRefresh();
}

/* ============================================================
   HORARIO: semana y mes, sesiones por grupo, lista y % evaluado,
   sesión estrella, "clase en curso" y "Hoy" en el Centro de mando
   ============================================================ */
const DIAS_CORTOS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAS_LARGOS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const GROUP_COLORS = ['#8B6CFF','#38BDF8','#3DDC97','#E8B84A','#FF6B8B','#FF9F5A','#C084FC','#22D3EE'];
function classColor(c){ const i = Math.max(0, STATE.classes.findIndex(x=>x.id===c.id)); return GROUP_COLORS[i % GROUP_COLORS.length]; }
function toMin(hhmm){ const [h,m] = String(hhmm||'0:0').split(':').map(Number); return h*60+(m||0); }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function weekdayOf(ds){ return new Date(ds+'T12:00:00').getDay(); }
function mondayOf(ds){ const d=new Date(ds+'T12:00:00'); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return localDate(d); }
function sessionsOn(date){
  const wd = weekdayOf(date), out = [];
  STATE.classes.forEach(c=>(c.horarios||[]).forEach(h=>{ if(Number(h.dia)===wd) out.push({c,h,date}); }));
  return out.sort((a,b)=>toMin(a.h.ini)-toMin(b.h.ini));
}
function listaPasada(classId, date){
  const d = dailyRecords(classId)[date]; return !!(d && Object.keys(d).length);
}
function sessionEvalInfo(classId, date){
  const c = getClass(classId);
  const acts = STATE.activities.filter(a=>a.classId===classId && a.evaluable && localDate(a.fecha)===date);
  if(!acts.length || !c.alumnos.length) return {acts, pct:null, items:[]};
  const items = acts.map(a=>{ const n=c.alumnos.filter(al=>{ const g=gradeFor(a.id,al.id); return g && g.valor!==null; }).length; return {a, n, total:c.alumnos.length}; });
  const done = items.reduce((s,x)=>s+x.n,0), tot = items.reduce((s,x)=>s+x.total,0);
  return {acts, items, pct: Math.round(done/tot*100)};
}
function sessionStatus(x){
  const today = localDate(), now = nowMin();
  const lista = listaPasada(x.c.id, x.date);
  const ev = sessionEvalInfo(x.c.id, x.date);
  let when = x.date<today ? 'past' : x.date>today ? 'future' : (now>=toMin(x.h.fin) ? 'past' : (now>=toMin(x.h.ini) ? 'now' : 'future'));
  return {lista, ev, when, star: lista && ev.pct===100, pendiente: !lista && (when==='past' || when==='now')};
}
function hhmm(m){ return pad2(Math.floor(m/60))+':'+pad2(m%60); }

/* ---- Vista ---- */
function viewHorarios(){
  const vista = routeParam('vista') || 'semana';
  const fecha = routeParam('fecha') || localDate();
  const total = STATE.classes.reduce((n,c)=>n+(c.horarios||[]).length,0);
  const hasSat = STATE.classes.some(c=>(c.horarios||[]).some(h=>Number(h.dia)===6));
  const cols = hasSat ? 6 : 5;
  const nav = vista==='mes' ? 30 : 7;
  const prev = shiftDate(fecha, vista==='mes' ? -new Date(fecha+'T12:00:00').getDate() : -7);
  const next = vista==='mes' ? localDate(new Date(new Date(fecha+'T12:00:00').getFullYear(), new Date(fecha+'T12:00:00').getMonth()+1, 1, 12)) : shiftDate(fecha, 7);
  const head = `
  <div class="view-head view-head-row">
    <div><div class="kicker" style="margin:0 0 4px;">Horario</div><h1>Tu semana, de un vistazo.</h1><div class="sub">Cada sesión muestra si ya pasaste lista y cuánto llevas evaluado. Toca una para abrirla.</div></div>
    <div class="view-actions"><button class="btn btn-primary btn-sm" onclick="openHorarioModal()">+ Agregar horario</button></div>
  </div>
  <div class="hor-bar">
    <a class="btn btn-outline btn-sm" href="#/horarios?vista=${vista}&fecha=${prev}">‹</a>
    <a class="btn btn-outline btn-sm" href="#/horarios?vista=${vista}&fecha=${localDate()}">Hoy</a>
    <a class="btn btn-outline btn-sm" href="#/horarios?vista=${vista}&fecha=${next}">›</a>
    <span class="hor-range">${vista==='mes' ? new Date(fecha+'T12:00:00').toLocaleDateString('es-MX',{month:'long',year:'numeric'}) : rangoSemana(fecha)}</span>
    <span class="spacer"></span>
    <div class="hor-toggle"><a class="${vista==='semana'?'on':''}" href="#/horarios?vista=semana&fecha=${fecha}">Semana</a><a class="${vista==='mes'?'on':''}" href="#/horarios?vista=mes&fecha=${fecha}">Mes</a></div>
  </div>
  <div class="hor-legend">${STATE.classes.map(c=>`<span><i style="background:${classColor(c)}"></i>${escapeHtml(c.grado+c.grupo)}</span>`).join('')}</div>`;
  if(!total){
    return head + emptyState('📅','Aún no tienes horario','Agrega los días y horas en que das cada grupo; aquí verás tus sesiones y si ya pasaste lista.','openHorarioModal()','+ Agregar horario');
  }
  return head + (vista==='mes' ? horarioMes(fecha, cols) : horarioSemana(fecha, cols));
}
function rangoSemana(fecha){
  const m = mondayOf(fecha), f = shiftDate(m,4);
  const o = {day:'numeric', month:'short'};
  return new Date(m+'T12:00:00').toLocaleDateString('es-MX',o)+' – '+new Date(f+'T12:00:00').toLocaleDateString('es-MX',{...o, year:'numeric'});
}
function sesionCard(x){
  const st = sessionStatus(x);
  const label = st.star ? '★ Sesión estrella' : st.lista ? 'Lista ✓' : st.when==='future' ? 'Próxima' : st.when==='now' ? 'En curso' : 'Pendiente';
  const cls = st.star ? 'star' : st.lista ? 'ok' : st.when==='future' ? 'next' : st.when==='now' ? 'now' : 'pend';
  return `<button class="hor-ses" style="border-left-color:${classColor(x.c)}" onclick="openSesionHorario('${x.c.id}','${x.h.id}','${x.date}')">
    <div class="hs-top"><span class="hs-chip" style="background:${classColor(x.c)}22; color:${classColor(x.c)};">${escapeHtml(x.c.grado+x.c.grupo)}</span><b>${escapeHtml(x.c.materia)}</b></div>
    <div class="hs-time">${x.h.ini}–${x.h.fin} · ${x.c.alumnos.length} al.</div>
    <div class="hs-st ${cls}">${label}${st.ev.pct!==null?` · ${st.ev.pct}% evaluado`:''}</div>
  </button>`;
}
function horarioSemana(fecha, cols){
  const lunes = mondayOf(fecha), today = localDate();
  let html = `<div class="hor-week cols-${cols}">`;
  for(let i=0;i<cols;i++){
    const ds = shiftDate(lunes, i), ses = sessionsOn(ds);
    const sinLista = ses.filter(x=>sessionStatus(x).pendiente).length;
    html += `<div class="hor-day ${ds===today?'today':''}">
      <div class="hd-head"><div><div class="hd-name">${DIAS_CORTOS[(i+1)%7]}</div><div class="hd-num">${new Date(ds+'T12:00:00').getDate()}</div></div>
        <div class="hd-meta">${ses.length?ses.length+' sesion'+(ses.length>1?'es':''):'Sin sesiones'}${sinLista?`<div class="hd-warn">⏱ ${sinLista} sin lista</div>`:''}</div></div>
      ${ses.map(sesionCard).join('')}
    </div>`;
  }
  return html + '</div>';
}
function horarioMes(fecha, cols){
  const d0 = new Date(fecha+'T12:00:00'); const y=d0.getFullYear(), m=d0.getMonth();
  const first = localDate(new Date(y,m,1,12)); const last = new Date(y,m+1,0,12);
  let cur = mondayOf(first); const today = localDate();
  let html = `<div class="hor-month cols-${cols}">` + DIAS_CORTOS.slice(1,1+cols).concat(cols===6?[]:[]).map(n=>`<div class="hm-h">${n}</div>`).join('');
  while(new Date(cur+'T12:00:00') <= last){
    for(let i=0;i<cols;i++){
      const ds = shiftDate(cur,i), dd = new Date(ds+'T12:00:00'); const ses = sessionsOn(ds);
      const out = dd.getMonth()!==m;
      const pend = ses.filter(x=>sessionStatus(x).pendiente).length;
      html += `<a class="hm-cell ${out?'out':''} ${ds===today?'today':''}" href="#/horarios?vista=semana&fecha=${ds}">
        <div class="hm-n">${dd.getDate()}${pend?`<span class="hm-pend" title="${pend} sin lista">${pend}</span>`:''}</div>
        <div class="hm-dots">${ses.map(x=>{ const st=sessionStatus(x); return `<i style="background:${classColor(x.c)}; opacity:${st.lista||st.when==='future'?1:.45};" title="${escapeHtml(x.c.grado+x.c.grupo)} ${x.h.ini}"></i>`; }).join('')}</div>
      </a>`;
    }
    cur = shiftDate(cur,7);
  }
  return html + '</div>';
}
function openSesionHorario(classId, hId, date){
  const c = getClass(classId), h = (c.horarios||[]).find(x=>x.id===hId); if(!h) return;
  const x = {c,h,date}, st = sessionStatus(x);
  const k = dayCounts(classId, date);
  const whenTag = st.when==='past' ? ['PASADA','tag-gray'] : st.when==='now' ? ['EN CURSO','tag-info'] : ['PRÓXIMA','tag-warning'];
  openModal(`
    <div class="modal-head"><div><span class="tag ${whenTag[1]}">${whenTag[0]}</span><h3 style="margin-top:6px;">${escapeHtml(c.materia)} · ${escapeHtml(c.grado+c.grupo)}</h3><div class="small-muted">${dateLabel(date)} · ${h.ini}–${h.fin} · ${c.alumnos.length} alumnos</div></div><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      ${st.star?`<div style="padding:10px 12px; border-radius:10px; background:var(--warning-bg); color:var(--warning); font-weight:700; margin-bottom:12px;">★★★ Sesión estrella — pasaste lista y evaluaste al 100%.</div>`:''}
      <div class="kicker" style="margin:4px 0 8px;">Asistencia</div>
      ${st.lista ? `<div class="flexrow" style="gap:8px; flex-wrap:wrap;"><span class="tag tag-success">Lista pasada</span><span class="small-muted">${k.A} presentes · ${k.F} faltas · ${k.J} justificadas · ${k.R} retardos${k.sin?` · ${k.sin} sin marcar`:''}</span></div>
        <a class="btn btn-ghost btn-sm" style="margin-top:6px;" href="#/asistencia?clase=${classId}&fecha=${date}" onclick="closeModal()">Ver lista →</a>`
        : `<div class="small-muted" style="margin-bottom:8px;">${st.when==='future'?'Aún no es la hora.':'Todavía no pasas lista.'}</div>
        <div class="flexrow" style="gap:8px; flex-wrap:wrap;"><a class="btn btn-primary btn-sm" href="#/asistencia?clase=${classId}&fecha=${date}" onclick="closeModal()">Pasar lista</a><button class="btn btn-outline btn-sm" onclick="closeModal(); startQuickAttendance('${classId}')">📷 Con cámara</button></div>`}
      <div class="kicker" style="margin:16px 0 8px;">Evaluaciones de ese día</div>
      ${st.ev.items.length ? st.ev.items.map(it=>`<div class="flexrow" style="gap:8px; padding:6px 0; border-bottom:1px solid var(--line-soft);"><span style="flex:1; font-size:13.5px; font-weight:600;">${escapeHtml(it.a.titulo)}</span><span class="small-muted">${it.n} de ${it.total} · ${Math.round(it.n/it.total*100)}% evaluados</span></div>`).join('')
        + `<a class="btn btn-soft btn-sm" style="margin-top:10px;" href="#/actividades?clase=${classId}" onclick="closeModal()">Ir a evaluar →</a>`
        : `<div class="small-muted">No hay actividades creadas ese día.</div><a class="btn btn-outline btn-sm" style="margin-top:8px;" href="#/actividades?clase=${classId}" onclick="closeModal()">Crear actividad</a>`}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" style="color:var(--alert); margin-right:auto;" onclick="deleteHorario('${classId}','${hId}')">Quitar este horario</button><button class="btn btn-primary" onclick="closeModal()">Cerrar</button></div>`);
}

/* ---- Agregar / quitar horarios ---- */
function openHorarioModal(classId){
  const cid = classId || (getClass(STATE.activeClassId)||STATE.classes[0] || {}).id;
  if(!cid){ toast('Primero crea una clase','alert'); navigate('#/clases'); return; }
  const inp = 'padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--paper-50); color:var(--ink-900); font-size:14px;';
  openModal(`
    <div class="modal-head"><h3>Agregar horario</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Grupo</label><select id="hr-clase">${STATE.classes.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${classLabel(c)}</option>`).join('')}</select></div>
      <div class="field"><label>Días (puedes marcar varios)</label>
        <div class="flexrow" style="gap:6px; flex-wrap:wrap;">${[1,2,3,4,5,6].map(n=>`<label class="fchip" style="cursor:pointer; gap:6px;"><input type="checkbox" class="hr-dia" value="${n}"> ${DIAS_CORTOS[n]}</label>`).join('')}</div></div>
      <div class="grid grid-2">
        <div class="field"><label>Hora de inicio</label><input type="time" id="hr-ini" value="07:30" style="${inp} width:100%;"></div>
        <div class="field"><label>Hora de fin</label><input type="time" id="hr-fin" value="08:15" style="${inp} width:100%;"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveHorario()">Guardar horario</button></div>`);
}
function saveHorario(){
  const c = getClass(document.getElementById('hr-clase').value);
  const dias = Array.from(document.querySelectorAll('.hr-dia:checked')).map(x=>Number(x.value));
  const ini = document.getElementById('hr-ini').value, fin = document.getElementById('hr-fin').value;
  if(!dias.length){ toast('Marca al menos un día','alert'); return; }
  if(!ini || !fin || toMin(ini)>=toMin(fin)){ toast('La hora de fin debe ser después de la de inicio','alert'); return; }
  if(!c.horarios) c.horarios = [];
  let n=0;
  dias.forEach(d=>{ if(!c.horarios.some(h=>Number(h.dia)===d && h.ini===ini && h.fin===fin)){ c.horarios.push({id:uid('hr'), dia:d, ini, fin}); n++; } });
  saveState(); closeModal(); toast(n+' horario(s) guardado(s)','success'); render();
}
function deleteHorario(classId, hId){
  const c = getClass(classId);
  askConfirm('¿Quitar este horario? Las listas y calificaciones ya registradas no se borran.', ()=>{
    c.horarios = (c.horarios||[]).filter(h=>h.id!==hId); saveState(); closeModal(); toast('Horario quitado'); render();
  }, 'Sí, quitar');
}
function horariosConfigHtml(classId){
  const c = getClass(classId); const hs = (c.horarios||[]).slice().sort((a,b)=>(a.dia-b.dia)||(toMin(a.ini)-toMin(b.ini)));
  return `<div class="divider"></div>
    <div class="small-muted" style="font-weight:600; margin-bottom:6px;">Horarios de este grupo</div>
    ${hs.length? hs.map(h=>`<div class="flexrow" style="gap:8px; padding:4px 0;"><span style="flex:1; font-size:13px;">${DIAS_LARGOS[h.dia]} · ${h.ini}–${h.fin}</span><button class="btn btn-ghost btn-sm" onclick="deleteHorarioCfg('${classId}','${h.id}')">✕</button></div>`).join('') : '<div class="small-muted">Sin horario todavía.</div>'}
    <button class="btn btn-outline btn-sm" style="margin-top:6px;" onclick="openHorarioModal('${classId}')">+ Agregar horario</button>`;
}
function deleteHorarioCfg(classId, hId){
  const c = getClass(classId); c.horarios = (c.horarios||[]).filter(h=>h.id!==hId); saveState(); openClassConfigModal(classId);
}

/* ---- Centro de mando: clase en curso y "Hoy" ---- */
function claseActivaCard(){
  const today = localDate(), now = nowMin(), ses = sessionsOn(today);
  const cur = ses.find(x=>toMin(x.h.ini)<=now && now<toMin(x.h.fin));
  if(cur){
    const c = cur.c, st = sessionStatus(cur);
    const dur = toMin(cur.h.fin)-toMin(cur.h.ini), el = now-toMin(cur.h.ini);
    return `<div class="card clase-activa" style="border-left:4px solid ${classColor(c)};">
      <div class="kicker" style="margin:0 0 6px; color:var(--turq-400);">● En curso · termina ${cur.h.fin}</div>
      <div class="flexrow" style="gap:12px; flex-wrap:wrap;"><div style="font-family:var(--font-brand); font-size:22px; font-weight:700; flex:1; min-width:180px;">${escapeHtml(classLabel(c))}</div>
        <span class="tag ${st.lista?'tag-success':'tag-warning'}">${st.lista?'Lista pasada':'Lista pendiente'}</span><span class="small-muted">${c.alumnos.length} alumnos</span></div>
      <div class="progress-track" style="margin:12px 0;"><div class="progress-fill" style="width:${Math.min(100,Math.round(el/dur*100))}%"></div></div>
      <div class="flexrow" style="gap:8px; flex-wrap:wrap;">
        <a class="btn btn-primary btn-sm" href="#/asistencia?clase=${c.id}&fecha=${today}">Pasar lista</a>
        <button class="btn btn-outline btn-sm" onclick="startQuickAttendance('${c.id}')">📷 Con cámara</button>
        <a class="btn btn-outline btn-sm" href="#/actividades?clase=${c.id}">Evaluar</a>
        <a class="btn btn-outline btn-sm" href="#/calificaciones?clase=${c.id}">Concentrado</a>
      </div></div>`;
  }
  const next = ses.find(x=>toMin(x.h.ini)>now);
  return `<div class="card" style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
    <div style="width:44px; height:44px; border-radius:12px; background:var(--paper-100); display:flex; align-items:center; justify-content:center; font-size:20px;">🗓️</div>
    <div style="flex:1; min-width:220px;">
      <div style="font-weight:700; font-size:14.5px;">Sin clase activa ahora</div>
      <div class="small-muted">${next?`Sigue ${escapeHtml(classLabel(next.c))} a las ${next.h.ini}.`:(ses.length?'Ya terminaron tus sesiones de hoy.':'No tienes sesiones programadas hoy.')}</div>
    </div>
    <a class="btn btn-outline btn-sm" href="#/horarios">Mi horario →</a></div>`;
}
function hoyCard(){
  const today = localDate(), now = nowMin(), ses = sessionsOn(today);
  return `<div class="section-title">Hoy <span class="tag tag-info">${ses.length} clase${ses.length===1?'':'s'}</span><span class="spacer"></span><a class="small-muted" href="#/horarios">Mi horario →</a></div>
  <div class="card" style="padding:10px 14px;">
    ${ses.length ? ses.map(x=>{
      const st = sessionStatus(x);
      const tag = st.when==='past' ? ['TERMINADA','tag-success'] : st.when==='now' ? ['EN CURSO','tag-info'] : ['PRÓXIMA','tag-gray'];
      return `<div class="hoy-row" onclick="openSesionHorario('${x.c.id}','${x.h.id}','${today}')" style="border-left-color:${classColor(x.c)};">
        <span class="hoy-time">${x.h.ini}</span>
        <div style="flex:1; min-width:0;"><b style="font-size:13.5px;">${escapeHtml(classLabel(x.c))}</b><div class="small-muted">${x.c.alumnos.length} alumnos${st.pendiente?' · lista pendiente':''}</div></div>
        <span class="tag ${tag[1]}">${tag[0]}</span></div>`;
    }).join('') : `<div class="small-muted" style="padding:14px 4px;">No tienes sesiones programadas hoy. <a href="javascript:void(0)" onclick="openHorarioModal()">Agregar horario</a></div>`}
  </div>`;
}

/* ============================================================
   Arranque
   ============================================================ */
function boot(){
  if(isStudentRoute()){ startStudentMode(); return; }
  loadState();
  document.documentElement.setAttribute('data-theme', STATE.theme==='dark'?'dark':'light');
  if(STATE.session){
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app-shell').classList.add('active');
    if(!location.hash) location.hash='#/inicio';
    render();
  } else {
    renderAuth();
  }
}
boot();
</script>
