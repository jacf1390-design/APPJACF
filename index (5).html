   logotipo), Rajdhani (cifras) + Inter (interfaz) + JetBrains Mono (datos)
   Modo claro: "Lavanda" · Modo oscuro: "Arise" (predeterminado)
   ============================================================ */
:root{
  --ink-900:#1A1030; --ink-800:#2A1B4D; --ink-700:#3F2E75; --ink-600:#5A47A0;
  --turq-600:#6A3FF0; --turq-500:#7F57FF; --turq-400:#38BDF8; --turq-100:#EFE9FF;
  --paper-0:#FFFFFF; --paper-50:#F6F3FF; --paper-100:#ECE7FB;
  --line:#DDD5F3; --line-soft:#EBE6FA;
  --gray-500:#6B5F93; --gray-400:#8E84B2; --gray-300:#B8AFD8;
  --success:#0F8A5B; --success-bg:#E2F7EE;
  --warning:#9A6A0A; --warning-bg:#FBF0D8;
  --alert:#C42F52; --alert-bg:#FFE8EE;
  --info:#1B7FC8; --info-bg:#E3F3FF;
  --gold:#C9973A;
  --grad-primary:linear-gradient(135deg,#6A3FF0 0%,#4C7DFF 60%,#2BB3F5 100%);
  --glow-heading:none; --glow-a:rgba(124,92,255,.14); --glow-b:rgba(56,189,248,.10);
  --metal-ink:linear-gradient(180deg,#2A1B4D 0%,#4A2FA8 100%);
  --side-bg:linear-gradient(180deg,#120A28 0%,#1B0F3D 100%);

  --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
  --shadow-1:0 1px 2px rgba(26,16,48,.07), 0 1px 1px rgba(26,16,48,.04);
  --shadow-2:0 10px 30px rgba(60,30,140,.14);
  --font-display:'Cinzel','Cinzel Decorative',Georgia,serif;
  --font-brand:'Cinzel Decorative','Cinzel',Georgia,serif;
  --font-num:'Rajdhani','Inter',sans-serif;
  --font-ui:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;

  --sidebar-w:250px; --topbar-h:60px; --bottomnav-h:64px;
  color-scheme: light;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ink-900:#F0EBFF; --ink-800:#DED5FF; --ink-700:#C5B8F3; --ink-600:#A898E0;
  --turq-600:#8B6CFF; --turq-500:#9B80FF; --turq-400:#5CCBFF; --turq-100:rgba(139,108,255,.16);
  --paper-0:#191228; --paper-50:#0D0818; --paper-100:#221838;
  --line:#33265E; --line-soft:#271C48;
  --gray-500:#ADA0D8; --gray-400:#8A7CBA; --gray-300:#5E4F96;
  --success:#3DDC97; --success-bg:rgba(61,220,151,.13);
  --warning:#E8B84A; --warning-bg:rgba(232,184,74,.14);
  --alert:#FF6B8B; --alert-bg:rgba(255,107,139,.14);
  --info:#5CCBFF; --info-bg:rgba(92,203,255,.13);
  --gold:#E8B84A;
  --grad-primary:linear-gradient(135deg,#7A4DFF 0%,#5A6BFF 55%,#2FB8FF 100%);
  --glow-heading:0 0 22px rgba(139,108,255,.45); --glow-a:rgba(168,85,247,.22); --glow-b:rgba(56,152,255,.14);
  --metal-ink:linear-gradient(180deg,#FFFFFF 0%,#D8C8FF 55%,#A98BFF 100%);
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 14px 44px rgba(0,0,0,.55), 0 0 0 1px rgba(155,120,255,.14);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--font-ui); background:var(--paper-50); color:var(--ink-900);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--ink-900); font-weight:600; text-shadow:var(--glow-heading);}
h1{letter-spacing:.01em;}
p{margin:0;}
button{font-family:var(--font-ui); cursor:pointer;}
input,select,textarea{font-family:var(--font-ui);}
a{color:inherit;}
::selection{background:rgba(139,108,255,.45); color:#fff;}
.mono{font-family:var(--font-mono);}

/* Scrollbars */
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--gray-300); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Auth screen ---------- */
#auth-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(1100px 600px at 12% -10%, var(--turq-100), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, var(--info-bg), transparent 55%),
    var(--paper-50);
  padding:24px;
}
.auth-card{
  width:100%; max-width:400px; background:var(--paper-0); border:1px solid var(--line);
  border-radius:var(--radius-lg); padding:36px 32px 28px; box-shadow:var(--shadow-2);
}
.brandmark{display:flex; align-items:center; gap:10px; margin-bottom:26px;}
.brandmark .logo-glyph{width:38px; height:38px; flex:none;}
.brandmark .word{font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.02em; text-transform:uppercase;}
.brandmark .word b{color:var(--turq-600);}
.auth-card h1{font-size:22px; margin-bottom:4px;}
.auth-sub{color:var(--gray-500); font-size:13.5px; margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-700); margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--paper-50); color:var(--ink-900); font-size:14px; outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--turq-500); box-shadow:0 0 0 3px var(--turq-100);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:1px solid transparent; border-radius:var(--radius-sm); padding:10px 16px;
  font-size:13.5px; font-weight:600; transition:filter .12s, background .12s, transform .05s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--ink-900); color:#fff;}
.btn-primary:hover{filter:brightness(1.15);}
.btn-accent{background:var(--turq-600); color:#fff;}
.btn-accent:hover{filter:brightness(1.08);}
.btn-outline{background:transparent; border-color:var(--line); color:var(--ink-800);}
.btn-outline:hover{background:var(--paper-100);}
.btn-ghost{background:transparent; color:var(--gray-500); border-color:transparent;}
.btn-ghost:hover{background:var(--paper-100); color:var(--ink-800);}
.btn-danger{background:var(--alert); color:#fff;}
.btn-danger:hover{filter:brightness(1.08);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px; font-size:12.5px;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}
.auth-demo-note{margin-top:16px; font-size:12px; color:var(--gray-400); text-align:center; line-height:1.5;}

/* ---------- App shell ---------- */
#app-shell{display:none; min-height:100vh;}
#student-screen{display:none; min-height:100vh; padding:20px 16px 40px; background:radial-gradient(900px 500px at 10% -10%, var(--turq-100), transparent 60%), var(--paper-50);}
#app-shell.active{display:block;}

.sidebar{
  position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w); z-index:40;
  background:var(--ink-900); color:#CBD9E4; display:flex; flex-direction:column;
  border-right:1px solid rgba(255,255,255,.06);
}
.sidebar .side-head{padding:18px 18px 14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar .side-head .word{font-family:var(--font-display); font-weight:700; font-size:17px; color:#fff; letter-spacing:.02em; text-transform:uppercase;}
.sidebar .side-head .word b{color:var(--turq-400);}
.school-chip{margin:14px 14px 6px; padding:10px 12px; border-radius:var(--radius-md); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);}
.school-chip .lbl{font-size:10px; letter-spacing:.04em; color:#8FA4B8; margin-bottom:3px;}
.school-chip .val{font-size:13px; font-weight:600; color:#fff; display:flex; align-items:center; justify-content:space-between; gap:6px;}
.cycle-chip{margin:0 14px 10px; padding:7px 12px; border-radius:var(--radius-md); background:rgba(79,198,210,.1); border:1px dashed rgba(79,198,210,.35); font-size:11.5px; color:var(--turq-400); display:flex; align-items:center; justify-content:space-between; cursor:pointer;}

.side-nav{flex:1; overflow-y:auto; padding:6px 10px 10px;}
.side-group-label{font-size:10.5px; letter-spacing:.06em; color:#66798C; padding:14px 10px 6px; font-weight:600;}
.side-link{
  display:flex; align-items:center; gap:10px; padding:8.5px 10px; border-radius:9px; font-size:13.5px;
  color:#B9C9D6; margin-bottom:1px; position:relative; font-weight:500;
}
.side-link .ic{width:18px; text-align:center; flex:none; font-size:14px;}
.side-link:hover{background:rgba(255,255,255,.055); color:#fff;}
.side-link.active{background:linear-gradient(90deg, rgba(79,198,210,.16), rgba(79,198,210,.03)); color:#fff;}
.side-link.active::before{content:""; position:absolute; left:-10px; top:6px; bottom:6px; width:3px; border-radius:3px; background:var(--turq-400);}
.side-foot{padding:12px; border-top:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:10px;}
.avatar{width:32px; height:32px; border-radius:50%; background:var(--turq-500); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none;}
.side-foot .who{flex:1; min-width:0;}
.side-foot .who .nm{font-size:12.5px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.side-foot .who .rl{font-size:11px; color:#7E93A5; display:flex; align-items:center; gap:5px;}
.dot-online{width:6px; height:6px; border-radius:50%; background:var(--success); flex:none;}

.main-area{margin-left:var(--sidebar-w); min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  height:var(--topbar-h); border-bottom:1px solid var(--line); background:var(--paper-0);
  display:flex; align-items:center; padding:0 22px; gap:14px; position:sticky; top:0; z-index:30;
  padding-top:env(safe-area-inset-top,0px);
}
.topbar .crumb{font-size:12.5px; color:var(--gray-500);}
.topbar .crumb b{color:var(--ink-900);}
.topbar-search{flex:1; max-width:360px; position:relative; display:none;}
.topbar-search input{width:100%; padding:8px 12px 8px 32px; border-radius:20px; border:1px solid var(--line); background:var(--paper-50); font-size:13px; outline:none;}
.topbar-actions{margin-left:auto; display:flex; align-items:center; gap:8px;}
.icon-btn{
  width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--paper-0);
  display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink-700); position:relative;
}
.icon-btn:hover{background:var(--paper-100);}
.badge-dot{position:absolute; top:-3px; right:-3px; min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--alert); color:#fff; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid var(--paper-0);}

.view{padding:22px 26px 90px; max-width:1180px;}
.view-head{margin-bottom:20px;}
.view-head h1{font-size:23px;}
.view-head .sub{color:var(--gray-500); font-size:13px; margin-top:4px;}
.view-head-row{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.view-actions{display:flex; gap:8px; flex-wrap:wrap;}

/* Cards / grids */
.card{background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-md); padding:18px;}
.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

.stat-card{padding:15px 16px; border-radius:var(--radius-md); border:1px solid var(--line); background:var(--paper-0);}
.stat-card .lbl{font-size:11.5px; color:var(--gray-500); font-weight:600; display:flex; align-items:center; gap:6px; margin-bottom:8px;}
.stat-card .num{font-family:var(--font-display); font-size:26px; font-weight:700;}
.stat-card .num small{font-size:14px; color:var(--gray-400); font-weight:500;}

.quick-tile{
  display:flex; flex-direction:column; gap:10px; padding:16px; border-radius:var(--radius-md);
  border:1px solid var(--line); background:var(--paper-0); text-align:left; transition:border-color .12s, transform .08s, box-shadow .12s;
}
.quick-tile:hover{border-color:var(--turq-400); box-shadow:var(--shadow-1); transform:translateY(-1px);}
.quick-tile .qi{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px;}
.quick-tile .qt{font-weight:600; font-size:13.5px;}
.quick-tile .qd{font-size:11.5px; color:var(--gray-500);}

.tag{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600;}
.tag-success{background:var(--success-bg); color:var(--success);}
.tag-warning{background:var(--warning-bg); color:var(--warning);}
.tag-alert{background:var(--alert-bg); color:var(--alert);}
.tag-info{background:var(--info-bg); color:var(--info);}
.tag-gray{background:var(--paper-100); color:var(--gray-500);}

.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--paper-0);}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:560px;}
thead th{
  text-align:left; padding:10px 14px; font-size:11px; font-weight:700; color:var(--gray-500);
  border-bottom:1px solid var(--line); white-space:nowrap; background:var(--paper-50); position:sticky; top:0;
}
tbody td{padding:9px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--paper-50);}
.grade-input{width:64px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; font-size:13px; text-align:center; background:var(--paper-0); color:var(--ink-900);}
.grade-input:focus{outline:none; border-color:var(--turq-500); box-shadow:0 0 0 3px var(--turq-100);}
.grade-input.empty{background:var(--paper-100); color:var(--gray-400);}

.empty-state{padding:44px 20px; text-align:center; color:var(--gray-500);}
.empty-state .ei{font-size:30px; margin-bottom:10px;}
.empty-state .et{font-weight:600; color:var(--ink-800); margin-bottom:4px; font-size:14.5px;}
.empty-state .ed{font-size:12.5px; margin-bottom:14px;}

.toast-stack{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:320px;}
.toast{background:var(--ink-900); color:#fff; padding:11px 14px; border-radius:10px; font-size:12.5px; box-shadow:var(--shadow-2); display:flex; align-items:center; gap:8px; animation:toastIn .18s ease;}
.toast.success{background:var(--success);}
.toast.alert{background:var(--alert);}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.modal-backdrop{position:fixed; inset:0; background:rgba(11,30,51,.5); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(1px);}
.modal{background:var(--paper-0); border-radius:var(--radius-lg); width:100%; max-width:460px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-2); border:1px solid var(--line);}
.modal.modal-lg{max-width:680px;}
.modal-head{padding:18px 20px 4px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.modal-head h3{font-size:17px;}
.modal-body{padding:14px 20px 20px;}
.modal-foot{padding:14px 20px 20px; display:flex; justify-content:flex-end; gap:8px; border-top:1px solid var(--line-soft); margin-top:6px; padding-top:14px;}
.close-x{width:28px; height:28px; border-radius:8px; border:none; background:transparent; color:var(--gray-500); font-size:16px; display:flex; align-items:center; justify-content:center; flex:none;}
.close-x:hover{background:var(--paper-100);}
.check-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px;}
.check-row:last-child{border-bottom:none;}
.check-row input{width:17px; height:17px; accent-color:var(--turq-600);}

/* Bottom nav (mobile) */
.bottom-nav{
  display:none; position:fixed; bottom:0; left:0; right:0; height:var(--bottomnav-h); background:var(--paper-0);
  border-top:1px solid var(--line); z-index:50; padding-bottom:env(safe-area-inset-bottom,0px);
}
.bottom-nav .bn-row{height:var(--bottomnav-h); display:flex; align-items:stretch;}
.bn-item{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10px; color:var(--gray-400); font-weight:600;}
.bn-item .ic{font-size:18px;}
.bn-item.active{color:var(--turq-600);}
.bn-fab-row{position:fixed; bottom:calc(var(--bottomnav-h) + 10px + env(safe-area-inset-bottom,0px)); left:0; right:0; display:none; justify-content:center; z-index:49; pointer-events:none;}
.sheet-backdrop{position:fixed; inset:0; background:rgba(11,30,51,.45); z-index:99; display:none;}
.sheet{position:fixed; left:0; right:0; bottom:0; background:var(--paper-0); border-radius:18px 18px 0 0; z-index:100; padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px)); box-shadow:var(--shadow-2); display:none;}
.sheet-handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:6px auto 14px;}
.sheet-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.sheet-grid button{display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; font-size:11px; color:var(--ink-800); font-weight:600;}
.sheet-grid .qi{width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:19px;}

@media (max-width:640px){ .save-indicator{display:none;} }
@media (max-width:980px){
  .sidebar{display:none;}
  .main-area{margin-left:0;}
  .bottom-nav{display:block;}
  .view{padding:16px 16px calc(90px + var(--bottomnav-h));}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:1fr 1fr;}
  .grid-2{grid-template-columns:1fr;}
  .topbar{padding:0 14px;}
}
.hidden{display:none !important;}
.flexrow{display:flex; align-items:center; gap:8px;}
.spacer{flex:1;}
.small-muted{font-size:11.5px; color:var(--gray-500);}
.section-title{font-size:14px; font-weight:700; margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
.section-title .n{color:var(--gray-400); font-weight:600;}
.divider{height:1px; background:var(--line); margin:16px 0;}
.pill-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
.pill-tab{padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:600; border:1px solid var(--line); background:var(--paper-0); color:var(--gray-500);}
.pill-tab.active{background:var(--ink-900); color:#fff; border-color:var(--ink-900);}
.progress-track{height:6px; border-radius:6px; background:var(--paper-100); overflow:hidden;}
.progress-fill{height:100%; border-radius:6px; background:var(--turq-500);}
.avatar-sm{width:26px; height:26px; border-radius:50%; background:var(--info-bg); color:var(--info); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; flex:none;}

/* ============================================================
   TEMA ARISE — sobrescribe estilos base
   ============================================================ */
body{
  background:
    radial-gradient(900px 520px at 88% -8%, var(--glow-a), transparent 60%),
    radial-gradient(760px 520px at -8% 108%, var(--glow-b), transparent 60%),
    var(--paper-50);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:var(--font-display); letter-spacing:.02em; font-weight:700; text-shadow:var(--glow-heading);}
.view-head h1{font-family:var(--font-brand); font-size:26px; font-weight:700; letter-spacing:.015em;}
.auth-card h1{font-family:var(--font-brand); font-size:22px;}
.modal-head h3{font-size:16px;}
.section-title{font-family:var(--font-display); letter-spacing:.04em; font-size:13.5px;}
.stat-card .num{font-family:var(--font-num); font-size:32px; font-weight:700; letter-spacing:.01em; line-height:1.1;}
.stat-card .num small{font-family:var(--font-num); font-size:16px;}
.brandmark .word{font-family:var(--font-brand); font-weight:700; font-size:21px; letter-spacing:.03em; text-transform:none;
  background:var(--metal-ink); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none;}
:root[data-theme="dark"] .brandmark .word{filter:drop-shadow(0 0 12px rgba(139,108,255,.55));}
.brandmark .word b{background:linear-gradient(180deg,#CFF1FF 0%,#38BDF8 100%); -webkit-background-clip:text; background-clip:text; color:transparent;}
.brandmark .logo-glyph{filter:drop-shadow(0 0 10px rgba(124,92,255,.5));}

#auth-screen{
  background:
    radial-gradient(1000px 640px at 15% -10%, var(--glow-a), transparent 60%),
    radial-gradient(900px 560px at 105% 20%, var(--glow-b), transparent 55%),
    var(--paper-50);
}
.auth-card{box-shadow:var(--shadow-2); border-color:var(--line);}
:root[data-theme="dark"] .auth-card{background:linear-gradient(180deg,#1D1531 0%,#161024 100%);}

.btn-primary,.btn-accent{background:var(--grad-primary); color:#fff; border-color:transparent; box-shadow:0 4px 18px rgba(106,63,240,.35);}
.btn-primary:hover,.btn-accent:hover{filter:brightness(1.12); box-shadow:0 6px 24px rgba(106,63,240,.5);}
.btn-outline{border-color:var(--line); color:var(--ink-800);}
.btn-outline:hover{border-color:var(--turq-500); background:var(--turq-100);}
.btn-ghost:hover{background:var(--turq-100);}
.pill-tab.active{background:var(--grad-primary); color:#fff; border-color:transparent; box-shadow:0 2px 12px rgba(106,63,240,.35);}
.progress-fill{background:var(--grad-primary);}
.quick-tile:hover{border-color:var(--turq-500); box-shadow:0 10px 28px rgba(106,63,240,.22); transform:translateY(-1px);}
.card,.stat-card,.quick-tile,.table-wrap{box-shadow:var(--shadow-1);}
.field input:focus,.field select:focus,.field textarea:focus,.grade-input:focus{border-color:var(--turq-500); box-shadow:0 0 0 3px var(--turq-100);}
.modal-backdrop,.sheet-backdrop{background:rgba(8,4,20,.66);}
.modal{box-shadow:var(--shadow-2);}
.topbar{background:var(--paper-0); border-bottom-color:var(--line);}
.bn-item.active{color:var(--turq-600);}
thead th{letter-spacing:.04em;}

/* Barra lateral (siempre oscura, violeta profundo) */
.sidebar{background:var(--side-bg); color:#C9BEF0; border-right:1px solid rgba(155,120,255,.18);}
.sidebar .side-head{border-bottom-color:rgba(155,120,255,.18);}
.sidebar .side-head .word{font-size:17px; background:linear-gradient(180deg,#FFFFFF 0%,#D8C8FF 55%,#A98BFF 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 10px rgba(139,108,255,.5));}
.sidebar .side-head .word b{background:linear-gradient(180deg,#CFF1FF 0%,#38BDF8 100%); -webkit-background-clip:text; background-clip:text; color:transparent;}
.school-chip{background:rgba(139,108,255,.10); border:1px solid rgba(155,120,255,.28);}
.school-chip .lbl{color:#9C8DD0;}
.cycle-chip{background:rgba(92,203,255,.09); border:1px dashed rgba(92,203,255,.4); color:#5CCBFF;}
.side-group-label{color:#8272B8; letter-spacing:.08em;}
.side-link{color:#C9BEF0;}
.side-link:hover{background:rgba(155,120,255,.14); color:#fff;}
.side-link.active{background:linear-gradient(90deg, rgba(124,92,255,.34), rgba(124,92,255,.05)); color:#fff;}
.side-link.active::before{background:linear-gradient(180deg,#5CCBFF,#8B6CFF); box-shadow:0 0 10px rgba(92,203,255,.6);}
.side-foot{border-top-color:rgba(155,120,255,.18);}
.avatar{background:var(--grad-primary); box-shadow:0 0 12px rgba(124,92,255,.5);}
.side-foot .who .rl{color:#9C8DD0;}
.sidebar ::-webkit-scrollbar-thumb{background:#3A2C70;}

/* ---- Escáner de tarjetas (cámara) ---- */
#scanner-root{position:fixed; inset:0; z-index:300; background:#05030c; color:#fff; display:flex; flex-direction:column;}
.sc-top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; padding-top:calc(12px + env(safe-area-inset-top,0px)); background:rgba(25,18,40,.95); border-bottom:1px solid #33265E;}
.sc-title{font-family:var(--font-display); font-size:14px; font-weight:700; letter-spacing:.02em; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sc-close{background:var(--grad-primary); color:#fff; border:none; border-radius:9px; padding:9px 14px; font-weight:700; font-size:13px; flex:none;}
.sc-stage{position:relative; flex:1; min-height:0; background:#000; overflow:hidden;}
.sc-stage video{width:100%; height:100%; object-fit:cover;}
.sc-reticle{position:absolute; left:50%; top:50%; width:min(62vw,300px); height:min(62vw,300px); transform:translate(-50%,-50%); border:3px solid #5CCBFF; border-radius:18px; box-shadow:0 0 0 9999px rgba(5,3,12,.45), 0 0 24px rgba(92,203,255,.6); pointer-events:none;}
.sc-bottom{padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px)); background:rgba(25,18,40,.97); border-top:1px solid #33265E;}
.sc-msg{padding:10px 12px; border-radius:10px; font-size:14px; font-weight:600; text-align:center; margin-bottom:8px;}
.sc-count{font-family:var(--font-num); font-size:22px; font-weight:700; text-align:center;}
.sc-log{font-size:12px; color:#ADA0D8; text-align:center; min-height:16px; margin-top:4px; line-height:1.5;}
.sc-rv-name{font-family:var(--font-display); font-size:17px; font-weight:700; text-align:center; margin:10px 0 8px;}
.sc-rv-chips{display:flex; gap:8px; justify-content:center; margin-bottom:8px;}
.sc-rv-chips button{flex:1; max-width:62px; padding:12px 0; border-radius:10px; border:1px solid #5A47A0; background:#221838; color:#fff; font-family:var(--font-num); font-size:20px; font-weight:700;}
.sc-rv-row{display:flex; gap:8px; margin-bottom:8px;}
.sc-rv-row input{flex:1; min-width:0; padding:11px 12px; border-radius:10px; border:1px solid #5A47A0; background:#0D0818; color:#fff; font-size:15px;}
.sc-btn-main{flex:2; padding:13px; border-radius:10px; border:none; background:var(--grad-primary); color:#fff; font-weight:700; font-size:15px;}
.sc-btn-alt{flex:1; padding:13px; border-radius:10px; border:1px solid #5A47A0; background:transparent; color:#ADA0D8; font-weight:600;}

/* ============================================================
   ESTILO DE BOTONES Y MENÚS (referencia: miComunidad Escolar)
   ============================================================ */
.btn{border-radius:999px; padding:10px 20px; font-weight:600; gap:8px;}
.btn-sm{padding:7px 15px;}
.btn-primary,.btn-accent{background:#6A44F0; color:#fff; box-shadow:none;}
.btn-primary:hover,.btn-accent:hover{background:#7B57FF; filter:none; box-shadow:0 6px 18px rgba(106,68,240,.35);}
.btn-soft{background:var(--turq-100); color:var(--turq-600); border-color:transparent;}
.btn-soft:hover{background:rgba(139,108,255,.28);}
.btn-outline{background:var(--paper-0); border:1px solid var(--line); color:var(--ink-900); box-shadow:var(--shadow-1);}
.btn-outline:hover{background:var(--paper-100); border-color:var(--line);}
.btn-text{background:transparent; border-color:transparent; color:var(--ink-900); padding:9px 14px;}
.btn-text:hover{background:var(--paper-100);}
.btn-ghost{border-radius:999px;}
.card,.stat-card,.table-wrap{border-radius:16px;}
.modal{border-radius:22px;}

/* Chips de grupos (borde de color a la izquierda) */
.pill-tab,.class-chip{display:inline-flex; align-items:center; gap:8px; border-radius:10px; padding:9px 14px; font-size:13px; font-weight:600;
  border:1px solid transparent; border-left:3px solid var(--turq-500); background:var(--turq-100); color:var(--ink-800); box-shadow:none;}
.pill-tab.active,.class-chip.active{background:rgba(139,108,255,.26); border:1px solid var(--turq-500); border-left-width:3px; color:var(--ink-900); box-shadow:none;}
.class-chips{display:flex; gap:8px; flex-wrap:wrap; padding-bottom:14px; border-bottom:1px solid var(--line);}
.cc-ic{width:22px; height:22px; border-radius:50%; background:rgba(139,108,255,.25); display:inline-flex; align-items:center; justify-content:center; font-size:12px;}

/* Encabezado de Mis clases y secciones */
.mc-head{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.mc-ic{width:54px; height:54px; border-radius:16px; background:var(--grad-primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; flex:none; box-shadow:0 6px 20px rgba(106,63,240,.4);}
.mc-head h1{font-family:var(--font-brand); font-size:26px;}
.mc-actions{display:flex; gap:4px; flex-wrap:wrap;}
.cycle-pill{display:inline-flex; align-items:center; gap:6px; margin-top:8px; padding:6px 12px; border-radius:10px; background:var(--info-bg); border:1px solid rgba(92,203,255,.35); font-size:12.5px; color:var(--ink-800);}
.cycle-pill b{color:var(--turq-600);} .cycle-pill i{color:var(--gray-400); font-size:12px;}
.kicker{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gray-400); font-weight:700; margin:26px 0 12px;}

/* Tarjetas de opciones */
.quick-tile{border-radius:16px; padding:16px 16px 18px; gap:12px; position:relative; align-items:flex-start;}
.quick-tile .qi{width:44px; height:44px; border-radius:12px; font-size:20px;}
.quick-tile .qt{font-size:14.5px; font-weight:700;}
.quick-tile.big{padding:22px 20px; min-height:130px; justify-content:flex-end;}
.quick-tile.big .qi{width:52px; height:52px; border-radius:14px; font-size:24px;}
.quick-tile.big .qt{font-family:var(--font-display); font-size:19px;}
.quick-tile.opt-hl{border-color:var(--turq-400); background:linear-gradient(135deg, var(--paper-0) 40%, rgba(92,203,255,.12));}
.opt-badge{position:absolute; top:12px; right:12px; font-size:10px; font-weight:700; letter-spacing:.08em; padding:3px 9px; border-radius:20px; background:rgba(56,189,248,.18); color:var(--turq-400);}

/* Menú lateral */
.sidebar .side-head{padding:16px 14px 14px 18px;}
.side-collapse{margin-left:auto; width:28px; height:28px; border-radius:8px; border:none; background:transparent; color:#9C8DD0; font-size:18px; line-height:1;}
.side-collapse:hover{background:rgba(155,120,255,.16); color:#fff;}
.school-chip{display:flex; align-items:center; gap:10px; cursor:pointer; border-radius:14px; padding:10px 12px;}
.school-chip .sc-ic{width:30px; height:30px; border-radius:9px; background:rgba(92,203,255,.14); color:#5CCBFF; display:flex; align-items:center; justify-content:center; font-size:15px; flex:none;}
.school-chip .sc-tx{min-width:0; flex:1;}
.school-chip .val{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13.5px;}
.nav-chev{margin-left:auto; font-size:11px; opacity:.65; flex:none;}
.nav-ic{width:22px; text-align:center; flex:none; font-size:15px; filter:grayscale(1) brightness(1.9); opacity:.8;}
.side-link{border-radius:12px; padding:10px 12px; gap:12px; font-size:14px; font-weight:500;}
.side-link.active{background:rgba(124,92,255,.26); color:#fff;}
.side-link.active .nav-ic,.nav-group-btn.has-active .nav-ic{filter:none; opacity:1;}
.side-link.sub{font-size:13px; padding:8px 10px; gap:10px; border-radius:10px;}
.nav-group-btn{display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; border:none; background:transparent; color:#C9BEF0; font:500 14px var(--font-ui); border-radius:12px; text-align:left; margin-bottom:1px;}
.nav-group-btn:hover{background:rgba(155,120,255,.12); color:#fff;}
.nav-group-btn.has-active{color:#fff;}
.nav-sub{display:none; margin:2px 0 8px 22px; padding-left:8px; border-left:1px solid rgba(155,120,255,.28);}
.nav-sub.open{display:block;}
.side-foot{cursor:pointer; position:relative; padding:12px 14px;}
.side-foot:hover{background:rgba(155,120,255,.08);}
.av-wrap{position:relative; flex:none;}
.av-wrap .dot-online{position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border:2px solid #150C30; background:#3DDC97;}
.user-menu{display:none; position:absolute; left:10px; right:10px; bottom:68px; background:#1D1438; border:1px solid rgba(155,120,255,.3); border-radius:14px; padding:6px; box-shadow:0 14px 40px rgba(0,0,0,.55); z-index:60;}
.user-menu.open{display:block;}
.user-menu button,.user-menu a{display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border:none; background:transparent; color:#DED5FF; font:500 13.5px var(--font-ui); border-radius:10px; text-align:left; text-decoration:none;}
.user-menu button:hover,.user-menu a:hover{background:rgba(155,120,255,.16); color:#fff;}
/* Menú contraído */
#app-shell.nav-collapsed{--sidebar-w:76px;}
.nav-collapsed .side-head .word,.nav-collapsed .school-chip .sc-tx,.nav-collapsed .school-chip .nav-chev,.nav-collapsed .cycle-chip,
.nav-collapsed .side-group-label,.nav-collapsed .nav-text,.nav-collapsed .nav-chev,.nav-collapsed .nav-sub,.nav-collapsed .side-foot .who{display:none !important;}
.nav-collapsed .side-head{padding:16px 10px; flex-direction:column; gap:10px;}
.nav-collapsed .side-collapse{margin:0;}
.nav-collapsed .school-chip{justify-content:center; margin:10px 10px 6px; padding:8px;}
.nav-collapsed .side-link,.nav-collapsed .nav-group-btn{justify-content:center; padding:11px 0;}
.nav-collapsed .side-foot{justify-content:center;}
.nav-collapsed .user-menu{left:6px; right:auto; width:190px;}

/* Hoja "Más" (móvil) */
.sheet-row{display:flex; align-items:center; gap:12px; padding:9px 2px; text-decoration:none; color:var(--ink-900);}
.sheet-ic{width:38px; height:38px; border-radius:11px; background:var(--turq-100); display:flex; align-items:center; justify-content:center; font-size:17px; flex:none;}
.sheet-tx{flex:1; font-size:14px; font-weight:600;}
.sheet-go{color:var(--gray-400); font-size:18px;}
.sheet .kicker{margin:16px 0 6px;}
.bn-item.active .ic{background:rgba(139,108,255,.2); border-radius:14px; padding:2px 16px;}

/* ---- Reportes (estilo miComunidad Escolar) ---- */
.fchip{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:999px; padding:8px 14px; background:var(--paper-0); color:var(--ink-800); font-size:13.5px; font-weight:500; text-decoration:none; text-align:left; line-height:1.3;}
.fchip:hover{border-color:var(--turq-500);}
.fchip.on{background:var(--turq-100); border-color:var(--turq-500); color:var(--turq-600); font-weight:600;}
.gchip.on{background:rgba(232,184,74,.2); border-color:var(--gold); color:var(--ink-900);}
.rpt-wrap{max-width:760px;}
.rpt-title{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.rpt-back{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--paper-0); color:var(--ink-900); font-size:22px; line-height:1;}
.rpt-sec{padding:16px; margin-bottom:12px; border-radius:18px;}
.rpt-sec-h{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; font-size:14.5px;}
.rpt-chips{display:flex; flex-wrap:wrap; gap:8px;}
.rpt-hint{padding:14px; border-radius:14px; border:1px solid var(--line); background:var(--paper-100); text-align:center; color:var(--gray-500); margin-bottom:12px;}
.rpt-students{max-height:230px; overflow-y:auto; margin-top:8px;}
.rpt-bar{position:sticky; bottom:0; display:flex; gap:10px; padding:12px 0 6px; background:linear-gradient(180deg, transparent, var(--paper-50) 30%);}
.rpt-save{background:#A52A2E; color:#fff; border-color:transparent;}
.rpt-save:hover{background:#BF3338; box-shadow:0 6px 18px rgba(165,42,46,.4);}
.rep-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px;}
.rep-title{font-family:var(--font-ui); font-size:26px; font-weight:700; text-shadow:none; letter-spacing:0;}
.rep-filter{display:flex; flex-wrap:wrap; gap:8px; padding:12px; margin-bottom:10px; border-radius:18px;}
.rep-search{display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:14px; border-radius:18px;}
.rep-search input{flex:1; border:none; border-bottom:2px solid var(--gray-400); background:transparent; color:var(--ink-900); font-size:14px; padding:6px 2px; outline:none;}
.rep-card{background:var(--paper-0); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow-1);}
.rep-top{display:flex; justify-content:space-between; gap:10px;}
.rep-name{font-weight:700; font-size:15.5px; line-height:1.25;}
.rep-grp{color:var(--gray-500); font-size:13px; margin-top:2px;}
.rep-right{display:flex; align-items:flex-start; gap:10px; flex:none;}
.rep-date{font-size:12.5px; color:var(--gray-500); padding-top:2px; white-space:nowrap;}
.rep-del{width:40px; height:40px; border-radius:12px; border:none; background:var(--alert-bg); color:var(--alert); font-size:16px;}
.rep-bar{margin:10px 0 8px; padding:9px 12px; border-radius:10px; font-size:13.5px; font-weight:600; line-height:1.4;}
.rep-bar.lvl-leve{background:var(--warning-bg); color:var(--warning);}
.rep-bar.lvl-moderada{background:rgba(255,150,60,.2); color:#E0803A;}
.rep-bar.lvl-grave{background:var(--alert-bg); color:var(--alert);}
.rep-line{height:1px; background:var(--ink-900); opacity:.5; margin:6px 0 10px;}
.rep-desc{font-size:14px; line-height:1.5; min-height:20px;}
.rep-foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; font-size:12.5px; color:var(--gray-500);}
.rep-foot b{font-weight:700;}
@media (max-width:980px){ .rpt-bar{bottom:var(--bottomnav-h);} }

/* ---- Asistencia diaria ---- */
.asis-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.asis-date{padding:8px 12px; border:1px solid var(--line); border-radius:999px; background:var(--paper-0); color:var(--ink-900); font-size:13.5px;}
.asis-pill{padding:5px 12px; border-radius:999px; font-size:12px; font-weight:700; background:var(--success-bg); color:var(--success);}
.asis-pill.saving{background:var(--warning-bg); color:var(--warning);}
.asis-summary{display:grid; grid-template-columns:auto 1fr minmax(170px,220px); gap:18px; align-items:center; padding:16px; margin-bottom:12px; border:1px solid var(--line); border-radius:18px; background:var(--paper-0);}
.asis-donut{width:92px; height:92px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.asis-donut div{width:68px; height:68px; border-radius:50%; background:var(--paper-0); display:flex; align-items:center; justify-content:center; font-family:var(--font-num); font-size:24px; font-weight:700;}
.asis-counts{font-size:13.5px; display:grid; gap:3px;}
.asis-counts i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px;}
.asis-quick{padding:12px 14px; display:grid; gap:6px; font-size:13.5px; border-radius:14px;}
.asis-list{display:grid; gap:8px;}
.asis-row{display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:14px; background:var(--paper-0);}
.asis-row.is-F{background:var(--alert-bg);} .asis-row.is-J{background:var(--warning-bg);}
.asis-n{width:22px; color:var(--gray-400); font-size:12.5px; text-align:right; flex:none;}
.asis-nm{flex:1; min-width:0; font-size:13.5px; font-weight:600; line-height:1.3;}
.asis-btns{display:flex; gap:6px; flex:none; align-items:center;}
.asis-b{width:40px; height:40px; border-radius:11px; border:1px solid var(--line); background:var(--paper-0); color:var(--gray-500); font-weight:700; font-size:14px;}
.asis-b:hover{border-color:var(--turq-500);}
.asis-note{width:36px; height:40px; border:none; background:transparent; font-size:16px; opacity:.75;}
@media (max-width:720px){ .asis-summary{grid-template-columns:auto 1fr;} .asis-quick{grid-column:1 / -1;} .asis-row{flex-wrap:wrap;} .asis-nm{flex-basis:calc(100% - 40px);} .asis-btns{width:100%; justify-content:flex-end;} .asis-b{flex:1; max-width:64px;} }

/* ---- Horario ---- */
.hor-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.hor-range{font-weight:700; text-transform:capitalize; margin-left:6px;}
.hor-toggle{display:flex; background:var(--paper-100); border-radius:999px; padding:3px;}
.hor-toggle a{padding:6px 16px; border-radius:999px; font-size:13px; font-weight:600; text-decoration:none; color:var(--gray-500);}
.hor-toggle a.on{background:var(--paper-0); color:var(--ink-900); box-shadow:var(--shadow-1);}
.hor-legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--gray-500); margin-bottom:12px;}
.hor-legend i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px;}
.hor-week{display:grid; gap:10px; align-items:start;}
.hor-week.cols-5{grid-template-columns:repeat(5,minmax(0,1fr));} .hor-week.cols-6{grid-template-columns:repeat(6,minmax(0,1fr));}
.hor-day{background:var(--paper-0); border:1px solid var(--line); border-radius:16px; padding:10px; min-height:120px;}
.hor-day.today{border-color:var(--turq-500); box-shadow:0 0 0 1px var(--turq-500), 0 8px 24px rgba(106,63,240,.18);}
.hd-head{display:flex; justify-content:space-between; gap:6px; margin-bottom:8px;}
.hd-name{font-size:11px; letter-spacing:.1em; color:var(--gray-400); font-weight:700; text-transform:uppercase;}
.hd-num{font-family:var(--font-num); font-size:26px; font-weight:700; line-height:1;}
.hd-meta{font-size:11px; color:var(--gray-500); text-align:right;}
.hd-warn{color:var(--warning); font-weight:700; margin-top:2px;}

function seedName(seed){
  const r1 = seed*9301+49297, r2 = seed*4111+2003;
  const n = NAMES_A[Math.abs(r1)%NAMES_A.length];
  const a1 = APELLIDOS[Math.abs(r2)%APELLIDOS.length];
  const a2 = APELLIDOS[Math.abs(r1+r2)%APELLIDOS.length];
  return `${n} ${a1} ${a2}`;
}

function buildStudents(groupCode, count, seedBase){
  const arr = [];
  for(let i=0;i<count;i++){
    const seed = seedBase*97 + i*13 + 5;
    const nombre = seedName(seed);
    arr.push({
      id: `al-${groupCode}-${String(i+1).padStart(2,'0')}`,
      nombre,
      matricula: `256${groupCode}${String(i+1).padStart(3,'0')}`,
      grupo: groupCode
    });
  }
  return arr;
}

let lastSavedAt = null, saveFailed = false;

  try{

  }catch(e){
    console.warn('No se pudo guardar', e); saveFailed = true;
  }
  updateSaveIndicator();
}
function updateSaveIndicator(){
  const el = document.getElementById('save-indicator');

  const secs = Math.round((Date.now()-lastSavedAt)/1000);
  el.style.color='var(--gray-400)';
  el.textContent = secs<2 ? 'Guardado' : secs<60 ? `Guardado hace ${secs}s` : 'Guardado';
}

function toast(msg, kind){
  const stack = document.getElementById('toast-stack');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.innerHTML = `<span>${msg}</span>`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),250); }, 2600);
}
function openModal(html, opts){
  closeModal();
  const root = document.getElementById('modal-root');
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.id = 'active-modal-backdrop';
  bd.innerHTML = `<div class="modal ${opts&&opts.lg?'modal-lg':''}">${html}</div>`;
  bd.addEventListener('mousedown', (e)=>{ if(e.target===bd) closeModal(); });
  root.appendChild(bd);
}
function askConfirm(msg, onYes, yesLabel){
  window.__confirmYes = onYes;

    <div class="modal-head"><h3>Confirmar</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><p style="font-size:14px; line-height:1.5;">${escapeHtml(msg)}</p></div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" onclick="runConfirmYes()">${yesLabel||'Sí, continuar'}</button></div>`);
}
function runConfirmYes(){ const f=window.__confirmYes; window.__confirmYes=null; closeModal(); if(f) f(); }
function closeModal(){
  const bd = document.getElementById('active-modal-backdrop');
  if(bd) bd.remove();
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
}
function roundGrade(v){
  const prec = STATE.escalaPrecision;
  if(v===null || v===undefined || v==='') return null;
  const n = parseFloat(v);
  if(isNaN(n)) return null;
  if(prec==='enteros') return Math.round(n);
  if(prec==='centesimas') return Math.round(n*100)/100;
  return Math.round(n*10)/10;
}
function clampGrade(v){
  if(v===null) return null;
  return Math.max(0, Math.min(10, v));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   Helpers de negocio: promedios, ponderaciones, alertas
   ============================================================ */
function classActivities(classId){ return STATE.activities.filter(a=>a.classId===classId); }
function gradeFor(activityId, studentId){
  return STATE.grades.find(g=>g.activityId===activityId && g.studentId===studentId) || null;
}
function submissionFor(activityId, studentId){
  return STATE.submissions.find(s=>s.activityId===activityId && s.studentId===studentId) || null;
}
function ensureGradeRow(activityId, studentId){
  let g = gradeFor(activityId, studentId);
  if(!g){ g = {id:uid('gr'), activityId, studentId, valor:null, comentario:'', actualizadoEn:null, historial:[]}; STATE.grades.push(g); }
  return g;
}
function ensureCriteria(c){
  if(c.criterios) return;
  const names={actividades:'Actividades',proyectos:'Proyectos',evaluaciones:'Evaluaciones',participacion:'Participación',extra:'Puntos extra'};
  const w=c.ponderaciones||{actividades:30,proyectos:25,evaluaciones:30,participacion:10,extra:5};
  c.criterios=Object.keys(names).filter(k=>w[k]!==undefined).map(k=>({id:'cr-'+k, nombre:names[k], peso:Number(w[k])||0, tipo:'simple'}));
}
function defaultCriterioId(c){
  ensureCriteria(c);
  const k = c.criterios.find(x=>/activ/i.test(x.nombre)) || c.criterios[0];
  return k ? k.id : null;
}
function criterioOf(c,a){ ensureCriteria(c); return c.criterios.find(k=>k.id===a.criterioId) || c.criterios.find(k=>/activ/i.test(k.nombre)) || c.criterios[0]; }
function studentBreakdown(classId, studentId){
  const c=getClass(classId); ensureCriteria(c);
  const acts=classActivities(classId).filter(a=>a.evaluable);
  const rows=[]; let sumW=0, sumP=0;
  c.criterios.forEach(k=>{
    const items=[];
    acts.forEach(a=>{
      const ck=criterioOf(c,a); if(!ck || ck.id!==k.id) return;
      const g=gradeFor(a.id,studentId);
      if(g && g.valor!==null) items.push({v:g.valor, w:(k.tipo==='ponderado'?(Number(a.peso)||1):1)});
    });
    let prom=null;
    if(items.length){
      const tw=items.reduce((n,x)=>n+x.w,0);
      prom=items.reduce((n,x)=>n+x.v*x.w,0)/tw;
      if(k.peso>0){ sumW+=k.peso; sumP+=prom*k.peso; }
    }
    rows.push({criterio:k, prom:prom===null?null:roundGrade(prom), n:items.length, aporta: prom===null?null:prom*k.peso/100});
  });
  const final = sumW>0 ? roundGrade(sumP/sumW) : null;
  return {rows, final, sumW};
}
function studentAverage(classId, studentId){ return studentBreakdown(classId, studentId).final; }
function classAverage(classId){
  const c = getClass(classId);
  const vals = c.alumnos.map(a=>studentAverage(classId,a.id)).filter(v=>v!==null);
  if(!vals.length) return null;
  return roundGrade(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function studentAlertLevel(classId, studentId){
  const avg = studentAverage(classId, studentId);
  const att = studentAttendanceRate(classId, studentId);
  const fc = faultCounts(studentId);
  const reasons = [];
  let level = 'green';
  if(avg!==null && avg < 6){ level='red'; reasons.push(`Promedio ${avg.toFixed(1)}`); }
  else if(avg!==null && avg < 7){ if(level!=='red') level='yellow'; reasons.push(`Promedio ${avg.toFixed(1)}`); }
  if(att!==null && att < 70){ level='red'; reasons.push(`Asistencia ${att}%`); }
  else if(att!==null && att < 85){ if(level!=='red') level='yellow'; reasons.push(`Asistencia ${att}%`); }
  const cntF = studentAttendanceCounts(classId, studentId).F;
  if(cntF>=5){ if(level!=='red') level='yellow'; reasons.push(`${cntF} faltas`); }
  if(fc.grave>=1 || fc.moderada>=3){ level='red'; reasons.push(fc.grave? `${fc.grave} falta(s) grave(s)` : `${fc.moderada} faltas moderadas (trato de falta grave)`); }
  else if(fc.moderada>=1 || fc.leve>=3){ if(level!=='red') level='yellow'; reasons.push(fc.moderada? `${fc.moderada} falta(s) moderada(s)` : `${fc.leve} llamadas de atención (pasa a falta moderada)`); }
  else if(fc.leve>0){ reasons.push(`${fc.leve} llamada(s) de atención`); }
  const abiertasSimples = STATE.incidents.filter(i=>i.studentId===studentId && !i.nivel && i.estado!=='CERRADA').length;
  if(abiertasSimples>0){ if(level!=='red') level='yellow'; reasons.push(`${abiertasSimples} incidencia(s) abierta(s)`); }
  const pend = classActivities(classId).filter(a=>a.evaluable).filter(a=>{
    const g = gradeFor(a.id, studentId);
    return !g || g.valor===null;
  }).length;
  if(pend>=3){ level='red'; reasons.push(`${pend} actividades pendientes`); }
  else if(pend>=1 && level==='green'){ level='yellow'; reasons.push(`${pend} actividad(es) pendiente(s)`); }
  if(!reasons.length) reasons.push('Sin novedades');
  return {level, reasons};
}
function weightSum(c){
  ensureCriteria(c);
  return c.criterios.reduce((a,k)=>a+Number(k.peso||0),0);
}

function initials(name){ const p=name.split(' '); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase(); }

  return c.criterios.map(k=>`<option value="${k.id}" ${k.id===selectedId?'selected':''}>${escapeHtml(k.nombre)} (${k.peso}%)</option>`).join('');
}

}
function setActivityPeso(actId, val){

          <input type="number" min="0" max="100" value="${k.peso}" style="width:64px; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--paper-50); color:var(--ink-900);" onchange="updateCriterio('${classId}','${k.id}','peso',this.value)"><span class="small-muted">%</span>

function refreshCriteriaTotal(classId){
  const c=getClass(classId); const tot=weightSum(c); const ok=tot===100;
  const el=document.getElementById('cr-total'); if(!el) return;
  el.style.background = ok?'var(--success-bg)':'var(--alert-bg)'; el.style.color = ok?'var(--success)':'var(--alert)';
  el.textContent = `Total: ${tot}% de 100% ${ok?'✓':'— debe sumar 100%'}`;
}
function updateCriterio(classId, critId, field, val){
  const c=getClass(classId); const k=c.criterios.find(x=>x.id===critId); if(!k) return;
  if(field==='peso') k.peso = Math.max(0, Math.min(100, Number(val)||0));
  else if(field==='nombre') k.nombre = (val||'').trim() || 'Criterio';
  else k[field]=val;
  saveState(); refreshCriteriaTotal(classId);
}
function addCriterio(classId){
  const c=getClass(classId); ensureCriteria(c);
  c.criterios.push({id:uid('cr'), nombre:'Nuevo criterio', peso:0, tipo:'simple'});
  saveState(); openClassConfigModal(classId);
}
function deleteCriterio(classId, critId){
  const c=getClass(classId);
  if(c.criterios.length<=1){ toast('Debe quedar al menos un criterio','alert'); return; }
  const k=c.criterios.find(x=>x.id===critId);
  const used = classActivities(classId).filter(a=>criterioOf(c,a).id===critId).length;
  const go = ()=>{
    c.criterios = c.criterios.filter(x=>x.id!==critId);
    const fallback = c.criterios[0].id;
    classActivities(classId).forEach(a=>{ if(a.criterioId===critId || !c.criterios.some(x=>x.id===a.criterioId)) a.criterioId=fallback; });
    saveState(); openClassConfigModal(classId);
  };
  if(used) askConfirm(`"${k.nombre}" tiene ${used} actividad(es). Pasarán al primer criterio de la lista. ¿Continuar?`, go);
  else go();
}
function copyCriteriaFrom(classId, srcId){
  const c=getClass(classId), src=getClass(srcId); ensureCriteria(src);
  const map={};
  c.criterios = src.criterios.map(k=>{ const nid=uid('cr'); map[k.id]=nid; return {id:nid, nombre:k.nombre, peso:k.peso, tipo:k.tipo}; });
  classActivities(classId).forEach(a=>{ a.criterioId = c.criterios[0].id; });
  saveState(); toast('Criterios copiados','success'); openClassConfigModal(classId, 'Criterios copiados de '+classLabel(src)+'. Revisa a qué criterio pertenece cada actividad.');
}
function classChecks(excludeId, cls){
  const others = STATE.classes.filter(x=>x.id!==excludeId);
  if(!others.length) return '';
  return `<div style="border:1px solid var(--line); border-radius:10px; padding:4px 12px; max-height:200px; overflow-y:auto;">
    <label class="check-row" style="font-weight:600;"><input type="checkbox" onchange="toggleAllTargets(this,'${cls}')"> Seleccionar todos (${others.length})</label>
    ${others.map(x=>`<label class="check-row"><input type="checkbox" class="${cls}" value="${x.id}"> ${classLabel(x)} <span class="small-muted">· ${x.alumnos.length} alumnos</span></label>`).join('')}
  </div>`;
}
function toggleAllTargets(master, cls){
  document.querySelectorAll('.'+cls).forEach(cb=>{ cb.checked = master.checked; });
}
function checkedTargets(cls){ return Array.from(document.querySelectorAll('.'+cls+':checked')).map(cb=>cb.value); }
function matchCriterioId(target, nombre){
  ensureCriteria(target);
  const m = nombre && target.criterios.find(k=>k.nombre.trim().toLowerCase()===nombre.trim().toLowerCase());
  return m ? m.id : defaultCriterioId(target);
}
function applyCriteriaToAll(classId){
  const c=getClass(classId);
  const ids = checkedTargets('cr-target');
  if(!ids.length){ toast('Marca al menos un grupo','alert'); return; }
  const nombres = ids.map(i=>classLabel(getClass(i))).join(', ');
  askConfirm(`Se reemplazarán los criterios de: ${nombres}. Sus actividades se reubicarán en el criterio con el mismo nombre. ¿Continuar?`, ()=>{
    ids.forEach(tid=>{
      const t=getClass(tid); ensureCriteria(t);
      const oldNames = {}; t.criterios.forEach(k=>{ oldNames[k.id]=k.nombre; });
      t.criterios = c.criterios.map(k=>({id:uid('cr'), nombre:k.nombre, peso:k.peso, tipo:k.tipo}));
      classActivities(tid).forEach(a=>{ a.criterioId = matchCriterioId(t, oldNames[a.criterioId]); });
    });
    saveState(); toast('Criterios aplicados a '+ids.length+' grupo(s)','success');
    openClassConfigModal(classId, `Criterios aplicados a: ${nombres}`);
  }, 'Sí, aplicar');
}
function openCopyActivityModal(actId){
  const a=STATE.activities.find(x=>x.id===actId); const c=getClass(a.classId);
  openModal(`
    <div class="modal-head"><h3>Copiar actividad a otros grupos</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div style="font-weight:600; margin-bottom:2px;">${escapeHtml(a.titulo)}</div>
      <div class="small-muted" style="margin-bottom:10px;">Desde ${classLabel(c)} · criterio ${escapeHtml(criterioOf(c,a).nombre)}. En cada grupo se asigna al criterio con el mismo nombre.</div>
      ${classChecks(a.classId,'cp-target') || '<div class="small-muted">Aún no tienes otros grupos.</div>'}
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="copyActivityTo('${actId}')">Copiar</button></div>
  `);
}
function cloneActivityTo(a, srcClass, targetId){
  const t=getClass(targetId);
  STATE.activities.push({id:uid('act'), classId:targetId, titulo:a.titulo, tipo:a.tipo, evaluable:a.evaluable, fecha:new Date().toISOString(), estado:'activa', peso:a.peso, criterioId:matchCriterioId(t, criterioOf(srcClass,a).nombre)});
}
function copyActivityTo(actId){
  const a=STATE.activities.find(x=>x.id===actId); const c=getClass(a.classId);
  const ids=checkedTargets('cp-target');
  if(!ids.length){ toast('Marca al menos un grupo','alert'); return; }
  ids.forEach(tid=>cloneActivityTo(a,c,tid));
  saveState(); closeModal(); toast('Actividad copiada a '+ids.length+' grupo(s)','success'); render();
}

      <div class="table-wrap"><table>

function startSession(classId){
  const c = getClass(classId);
  const opts = {
    asistencia: document.getElementById('opt-asistencia').checked,
    actividad: document.getElementById('opt-actividad').checked,
    evaluacion: document.getElementById('opt-evaluacion').checked,
    bitacora: document.getElementById('opt-bitacora').checked,
    evidencia: document.getElementById('opt-evidencia').checked,
    modo: document.getElementById('opt-modo').value,
  };
  const now = new Date();
  const sessionId = uid('ses');
  let activityId = null;
  if(opts.actividad){
    activityId = uid('act');
    STATE.activities.push({
      id:activityId, classId, titulo:((document.getElementById('opt-titulo')||{}).value||'').trim()||'Actividad de la sesión', instrucciones:((document.getElementById('opt-instr')||{}).value||''), tipo:'actividad de clase',
      evaluable:true, fecha:now.toISOString(), estado:'activa', sessionId, criterioId:defaultCriterioId(c)
    });
  }
  const session = {
    id:sessionId, classId, fecha:now.toISOString(), horaInicio:now.toISOString(),
    duracionMin:50, opciones:opts, activityId,
    qrToken: sessionId+'-'+Math.random().toString(36).slice(2,8),
    presentes:0, retardos:0, cerrada:false, tolerancia:10, synced: syncCfg() ? 'pending' : false,
  };
  STATE.sessions.push(session);
  publishSession(session);
  STATE.activeSessionId = sessionId;
  closeModal();
  navigate('#/sesion/'+sessionId);
  toast('Sesión iniciada. QR inteligente generado.', 'success');
}

      <div style="margin-top:14px;">
        <span class="tag ${s.cerrada?'tag-gray':'tag-success'}">${s.cerrada?'QR detenido':'QR activo'}</span>
        <span class="tag tag-info">Modo ${s.opciones.modo}</span>
      </div>
      ${!s.cerrada?`

      <button class="btn btn-ghost btn-sm btn-block" style="margin-top:6px;" onclick="openCardsModal('${c.id}')">🪪 Imprimir tarjetas QR de este grupo</button>
      <div class="divider"></div>
      <div class="small-muted" style="margin-bottom:8px;">Simulador de escaneo (demo — sustituye la cámara del alumno)</div>
      <button class="btn btn-accent btn-block" ${pendientes.length===0?'disabled':''} onclick="simulateScan('${s.id}')">📷 Simular escaneo de alumno</button>

        <div class="stat-card"><div class="lbl">⏳ Pendientes</div><div class="num">${pendientes.length}</div></div>

function hookSesion(sessionId){
  const s = STATE.sessions.find(x=>x.id===sessionId);
  if(!s) return;
  const holder = document.getElementById('qr-holder');
  if(holder && window.QRCode){
    holder.innerHTML='';
    try{
      const real = syncCfg() && s.synced===true;
      if(syncCfg() && !real && !s.cerrada){ holder.innerHTML = '<div class="small-muted" style="padding:60px 0;">'+(s.synced==='pending'?'Conectando…':'Sin conexión')+'</div>'; }
      else new QRCode(holder, {text: real ? sessionQrUrl(s) : 'JACEDUCA::'+s.qrToken, width: real?300:170, height: real?300:170, colorDark:'#0B1E33', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.L});
    }catch(e){ holder.innerHTML = '<div class="mono" style="font-size:11px;">'+s.qrToken+'</div>'; }
  }
  startSessionPolling(sessionId);
}

function sessionTimingStatus(s){
  const start = new Date(s.horaInicio).getTime();
  const now = Date.now();
  const minsIn = (now-start)/60000;
  return minsIn > s.tolerancia ? 'retardo' : 'presente';
}

function registerAttendance(sessionId, studentId, viaManual, noSubmission){
  const s = STATE.sessions.find(x=>x.id===sessionId);
  const already = STATE.qrScans.find(sc=>sc.sessionId===sessionId && sc.studentId===studentId);
  if(already){ toast('Tu asistencia ya está registrada.', 'alert'); return already; }
  const tipo = viaManual ? 'presente' : sessionTimingStatus(s);
  const scan = {sessionId, studentId, hora:new Date().toISOString(), tipo};
  STATE.qrScans.push(scan);
  s.presentes = (s.presentes||0) + 1;
  if(tipo==='retardo') s.retardos = (s.retardos||0)+1;
  markDaily(s.classId, studentId, tipo==='retardo'?'R':'A', localDate(scan.hora), true);
  // Abrir actividad asignada automáticamente y registrar entrega (simulado)
  if(s.activityId && s.opciones.actividad && !noSubmission){
    const exists = submissionFor(s.activityId, studentId);
    if(!exists){
      STATE.submissions.push({id:uid('sub'), activityId:s.activityId, studentId, estado:'Entregada', entregaFecha:new Date().toISOString()});
      ensureGradeRow(s.activityId, studentId);
    }
  }
  return scan;
}
function simulateScan(sessionId){
  const s = STATE.sessions.find(x=>x.id===sessionId);
  const c = getClass(s.classId);
  const presentIds = new Set(STATE.qrScans.filter(sc=>sc.sessionId===sessionId).map(sc=>sc.studentId));
  const next = c.alumnos.find(a=>!presentIds.has(a.id));
  if(!next){ toast('Todo el grupo ya está presente'); return; }
  registerAttendance(sessionId, next.id, false);
  saveState();
  toast(`${next.nombre.split(' ')[0]} escaneó su QR · asistencia y actividad registradas`, 'success');
  render();
}
function attemptDuplicate(sessionId){
  const scans = STATE.qrScans.filter(sc=>sc.sessionId===sessionId);
  if(!scans.length){ toast('Aún no hay ningún alumno registrado para probar esto'); return; }
  registerAttendance(sessionId, scans[0].studentId, false);
}
function manualMark(sessionId, studentId){
  registerAttendance(sessionId, studentId, true);
  saveState(); toast('Asistencia marcada manualmente', 'success'); render();
}
function renewQr(sessionId){
  const s = STATE.sessions.find(x=>x.id===sessionId);
  s.qrToken = sessionId+'-'+Math.random().toString(36).slice(2,8);
  if(syncCfg()) s.synced='pending';
  saveState(); toast('QR renovado'); render(); publishSession(s);
}
function stopSession(sessionId){
  const s = STATE.sessions.find(x=>x.id===sessionId);
  const c = getClass(s.classId);
  closeRemoteSession(s);
  s.cerrada = true;
  s.horaFin = new Date().toISOString();
  if(s.opciones.asistencia){ c.alumnos.forEach(a=>markDaily(s.classId, a.id, 'F', localDate(s.fecha), true)); }
  // Bitácora automática
  if(s.opciones.bitacora){
    STATE.bitacora.unshift({
      id:uid('bit'), classId:s.classId, sessionId:s.id, fecha:s.fecha,
      tema: s.activityId ? STATE.activities.find(a=>a.id===s.activityId)?.titulo : 'Sesión de clase',
      actividad: s.activityId ? 'Sí — '+ (STATE.activities.find(a=>a.id===s.activityId)?.titulo||'') : 'No aplicó',
      asistenciaResumen: `${s.presentes||0}/${c.alumnos.length} presentes, ${s.retardos||0} retardo(s)`,
      observaciones:'', incidencias:'Ninguna registrada', acuerdos:'', pendientes: (c.alumnos.length-(s.presentes||0))+' alumno(s) sin registrar asistencia',
      auto:true,
    });
  }
  notify(`Sesión de ${classLabel(c)} cerrada · ${s.presentes||0}/${c.alumnos.length} presentes`, 'success');
  STATE.activeSessionId = null;
  saveState();
  toast('Sesión cerrada. Asistencia, bitácora y analítica actualizadas.', 'success');
  render();
}

function politicaLabel(){
  return {sin_calificar:'queda sin calificar', cero:'se califica automáticamente 0', pendiente:'queda como pendiente'}[STATE.politicaNoEntregado];
}
function setGrade(input){
  const activityId = input.dataset.act, studentId = input.dataset.al;
  const g = ensureGradeRow(activityId, studentId);
  const raw = input.value;
  let v = raw===''? null : clampGrade(roundGrade(raw));
  if(raw!=='' && (parseFloat(raw)<0 || parseFloat(raw)>10)){
    toast('La calificación debe estar entre 0 y 10', 'alert'); v = clampGrade(roundGrade(raw));
  }
  if(g.valor !== v){
    g.historial.push({anterior:g.valor, nuevo:v, usuario:STATE.docente.nombre, fecha:new Date().toISOString()});
  }
  g.valor = v; g.actualizadoEn = new Date().toISOString();
  input.value = v===null?'':v;
  input.classList.toggle('empty', v===null);
  saveState();
}
function setComment(input){
  const g = ensureGradeRow(input.dataset.act, input.dataset.al);
  g.comentario = input.value; saveState();
}
function applyMassGrade(activityId){
  const v = clampGrade(roundGrade(document.getElementById('mass-grade').value));
  if(v===null){ toast('Escribe una calificación válida'); return; }
  const c = getClass(STATE.activities.find(a=>a.id===activityId).classId);
  c.alumnos.forEach(al=>{

function viewAnalitica(){
  const filterClase = routeParam('clase');
  const classes = filterClase ? [getClass(filterClase)] : STATE.classes;
  const allAvgs = classes.map(c=>classAverage(c.id)).filter(v=>v!==null);
  const overall = allAvgs.length ? (allAvgs.reduce((a,b)=>a+b,0)/allAvgs.length) : null;
  const dist = {verde:0, amarillo:0, rojo:0};
  classes.forEach(c=>c.alumnos.forEach(a=>{
    const lvl = studentAlertLevel(c.id,a.id).level;
    dist[lvl==='green'?'verde':lvl==='yellow'?'amarillo':'rojo']++;
  }));
  const totalAl = dist.verde+dist.amarillo+dist.rojo || 1;

  return `
  <div class="view-head"><h1>Analítica académica</h1><div class="sub">Promedio, distribución, evolución y asistencia.</div></div>
  ${classPicker('#/analitica', filterClase)}

    <div class="stat-card"><div class="lbl">Alumnos en seguimiento</div><div class="num">${dist.amarillo+dist.rojo}</div></div>
    <div class="stat-card"><div class="lbl">Sesiones registradas</div><div class="num">${STATE.sessions.filter(s=>classes.some(c=>c.id===s.classId)).length}</div></div>
  </div>

  <div class="section-title">Distribución de seguimiento</div>
  <div class="card" style="margin-bottom:20px;">
    <div style="display:flex; height:18px; border-radius:9px; overflow:hidden; margin-bottom:10px;">
      <div style="width:${dist.verde/totalAl*100}%; background:var(--success);"></div>
      <div style="width:${dist.amarillo/totalAl*100}%; background:var(--warning);"></div>
      <div style="width:${dist.rojo/totalAl*100}%; background:var(--alert);"></div>
    </div>
    <div class="flexrow" style="gap:18px; font-size:12.5px;">
      <span>🟢 Adecuado (${dist.verde})</span><span>🟡 Seguimiento (${dist.amarillo})</span><span>🔴 Atención (${dist.rojo})</span>
    </div>
  </div>

  <div class="section-title">Promedio por clase</div>
  <div class="card">
    ${classes.map(c=>{
      const avg = classAverage(c.id) || 0;
      return `<div style="margin-bottom:12px;">
        <div class="flexrow" style="margin-bottom:4px; font-size:12.5px;"><span>${classLabel(c)}</span><span class="spacer"></span><b>${avg?avg.toFixed(1):'—'}</b></div>
        <div class="progress-track"><div class="progress-fill" style="width:${avg*10}%; background:${avg<6?'var(--alert)':avg<8?'var(--warning)':'var(--success)'}"></div></div>
      </div>`;
    }).join('')}
  </div>

  <div class="section-title">Asistencia por clase</div>
  <div class="card">
    ${classes.map(c=>{
      const sess = STATE.sessions.filter(s=>s.classId===c.id && s.cerrada);
      const avgAtt = classAttendanceAvg(c.id);
      return `<div style="margin-bottom:12px;">
        <div class="flexrow" style="margin-bottom:4px; font-size:12.5px;"><span>${classLabel(c)}</span><span class="spacer"></span><b>${avgAtt!==null?avgAtt+'%':'sin sesiones'}</b></div>
        <div class="progress-track"><div class="progress-fill" style="width:${avgAtt||0}%; background:var(--info);"></div></div>
      </div>`;
    }).join('')}
  </div>
  `;
}

function generateTeams(){
  const classId = document.getElementById('tm-clase').value;
  const n = Math.max(2, Number(document.getElementById('tm-n').value)||4);
  const c = getClass(classId);
  const ids = c.alumnos.map(a=>a.id);
  for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  const equipos = Array.from({length:n}, ()=>[]);
  ids.forEach((id,i)=> equipos[i%n].push(id));
  STATE.teams.push({id:uid('tm'), nombre:`Equipos · ${classLabel(c)}`, classId, equipos});
  saveState(); closeModal(); toast('Equipos generados aleatoriamente'); render();
}

/* ============================================================
   VISTA: Calendario
   ============================================================ */
function viewCalendario(){
  const now = new Date();
  const year=now.getFullYear(), month=now.getMonth();
  const first = new Date(year,month,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const eventsByDay = {};
  const addEv = (dateIso,label,type)=>{
    const d = new Date(dateIso);
    if(d.getMonth()!==month || d.getFullYear()!==year) return;
    const day = d.getDate();
    (eventsByDay[day] = eventsByDay[day]||[]).push({label,type});
  };
  STATE.sessions.forEach(s=>addEv(s.fecha, classLabel(getClass(s.classId)), 'info'));
  STATE.activities.forEach(a=>addEv(a.fecha, a.titulo, 'warning'));
  STATE.projects.forEach(p=>addEv(p.inicio, p.nombre, 'success'));

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = d===now.getDate();
    const evs = eventsByDay[d]||[];
    cells += `<div style="min-height:76px; border:1px solid var(--line); border-radius:8px; padding:6px; ${isToday?'border-color:var(--turq-500); background:var(--turq-100);':''}">
      <div style="font-size:11px; font-weight:700; margin-bottom:4px;">${d}</div>
      ${evs.slice(0,2).map(e=>`<div class="tag tag-${e.type}" style="display:block; margin-bottom:2px; font-size:9.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(e.label)}</div>`).join('')}
      ${evs.length>2?`<div class="small-muted" style="font-size:9.5px;">+${evs.length-2} más</div>`:''}
    </div>`;
  }
  return `
  <div class="view-head"><h1>Calendario</h1><div class="sub">${now.toLocaleDateString('es-MX',{month:'long', year:'numeric'})}</div></div>
  <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:8px; font-size:11px; color:var(--gray-500); font-weight:700;">
    ${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(d=>`<div>${d}</div>`).join('')}
  </div>
  <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:6px;">${cells}</div>
  `;
}

function viewReportes(){
  const tipos = [

  ${classPicker('#/reportes', filterClase)}
  <div class="grid grid-3">
    ${tipos.map(([key,label])=>`
      <div class="card">
        <div style="font-weight:700; margin-bottom:10px;">${label}</div>
        <div class="flexrow" style="gap:6px;">
          <button class="btn btn-outline btn-sm" onclick="generateReport('${filterClase}','${key}','PDF')">PDF</button>
          <button class="btn btn-outline btn-sm" onclick="generateReport('${filterClase}','${key}','XLSX')">XLSX</button>
          <button class="btn btn-outline btn-sm" onclick="generateReport('${filterClase}','${key}','CSV')">CSV</button>
        </div>
      </div>`).join('')}
  </div>
  ${conductReportPicker()}
  `;
}
function csvEscape(v){
  v = String(v===null||v===undefined?'':v);
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function buildReportCsv(classId, tipo){
  const c = getClass(classId);
  if(tipo==='calificaciones'){
    const acts = classActivities(c.id).filter(a=>a.evaluable);
    const header = ['Alumno','Matrícula', ...acts.map(a=>`${a.titulo} [${criterioOf(c,a).nombre} ${criterioOf(c,a).peso}%]`), 'Final'];
    const rows = c.alumnos.map(al=>{
      const avg = studentAverage(c.id, al.id);
      return [al.nombre, al.matricula, ...acts.map(a=>{ const g=gradeFor(a.id,al.id); return g&&g.valor!==null? g.valor : 'sin calificar'; }), avg!==null?avg.toFixed(1):''];
    });
    return [header, ...rows];
  }
  if(tipo==='asistencia'){
    const dias = Object.keys(dailyRecords(c.id)).sort();
    const header = ['Alumno','Asistencias','Faltas','Justificadas','Retardos','% asistencia', ...dias.map(d=>fmtDate(d+'T12:00:00'))];
    const rows = c.alumnos.map(a=>{ const k=studentAttendanceCounts(c.id,a.id); const rt=studentAttendanceRate(c.id,a.id);
      return [a.nombre, k.A, k.F, k.J, k.R, rt===null?'':rt+'%', ...dias.map(d=>{ const x=dayRecord(c.id,d,a.id); return x? x.s + (x.nota?' ('+x.nota+')':'') : ''; })];
    });
    return [header, ...rows];
  }
  if(tipo==='actividades'){
    const header = ['Actividad','Tipo','Fecha','Entregadas','Calificadas'];
    const rows = classActivities(c.id).filter(a=>a.evaluable).map(a=>[
      a.titulo, a.tipo, fmtDate(a.fecha),
      STATE.submissions.filter(s=>s.activityId===a.id).length,
      STATE.grades.filter(g=>g.activityId===a.id && g.valor!==null).length
    ]);
    return [header, ...rows];
  }
  if(tipo==='incidencias'){
    const header = ['Alumno','Nivel','Falta (según AEC)','Descripción','Fecha','Estado','Medidas aplicadas'];
    const rows = STATE.incidents.filter(i=>i.classId===c.id).map(i=>{
      const nv=i.nivel||'leve';
      return [getStudent(c.id,i.studentId)?.nombre||'', i.nivel?NIVELES[nv][0]:'', i.faltaTexto||i.categoria||'', i.descripcion||'', fmtDate(i.fecha), i.estado, (i.medidasHechas||[]).map(k=>STATE.aec.medidas[nv][k]).filter(Boolean).join(' | ')];
    });
    return [header, ...rows];
  }
  if(tipo==='justificantes'){
    const header = ['Alumno','Motivo','Fecha','Estado'];
    const rows = STATE.justifications.filter(j=>j.classId===c.id).map(j=>[getStudent(c.id,j.studentId)?.nombre||'', j.motivo, fmtDate(j.fecha), j.estado]);
    return [header, ...rows];
  }
  return null;
}
function generateReport(classId, tipo, formato){
  const c = getClass(classId);
  const nombre = `${tipo}_${c.grado}${c.grupo}_${new Date().toISOString().slice(0,10)}.${formato.toLowerCase()}`;
  const table = buildReportCsv(classId, tipo);
  let real = false;
  if(formato==='CSV' && table){
    const csv = table.map(row=>row.map(csvEscape).join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    real = true;
  } else if(formato==='PDF' && table){
    printReportAsPdf(table, `${tipo} · ${classLabel(c)}`);
    real = true;
  }
  STATE.reports.unshift({id:uid('rep'), classId, tipo, formato, nombre, fecha:new Date().toISOString(), archivado:false, real});
  notify(`Reporte de ${tipo} (${formato}) generado para ${classLabel(c)}`, 'success');
  saveState();
  toast(real ? 'Reporte descargado' : `${formato} aún no disponible para "${tipo}" en este prototipo — intenta CSV`, real?'success':undefined);
  render();
}
function printReportAsPdf(table, titulo){
  const w = window.open('', '_blank');
  if(!w){ toast('Habilita las ventanas emergentes para imprimir el PDF'); return; }
  const rows = table.map((r,i)=>`<tr>${r.map(cell=>`<${i===0?'th':'td'} style="border:1px solid #ccc; padding:6px 10px; font-size:12px; text-align:left;">${escapeHtml(cell)}</${i===0?'th':'td'}>`).join('')}</tr>`).join('');
  w.document.write(`<html><head><title>${escapeHtml(titulo)}</title></head><body style="font-family:sans-serif;">
    <h2>${escapeHtml(titulo)}</h2><table style="border-collapse:collapse; width:100%;">${rows}</table>
    <scr${''}ipt>window.onload=()=>window.print()<\/scr${''}ipt></body></html>`);
  w.document.close();
}

function filterReports(q){
  q=q.toLowerCase();
  document.querySelectorAll('#reports-table tbody tr').forEach(tr=>tr.style.display=tr.dataset.name.includes(q)?'':'none');

function redownloadReport(id){
  const r = STATE.reports.find(x=>x.id===id);
  const c = getClass(r.classId);
  const table = buildReportCsv(r.classId, r.tipo);
  if(!table){ toast('Este tipo de reporte no tiene datos descargables en el prototipo'); return; }
  if(r.formato==='PDF'){ printReportAsPdf(table, `${r.tipo} · ${classLabel(c)}`); return; }
  const csv = table.map(row=>row.map(csvEscape).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=r.nombre.replace(/\.(xlsx|pdf)$/,'.csv');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Descargado');
}
function archiveReport(id){
  const r = STATE.reports.find(x=>x.id===id); r.archivado=!r.archivado; saveState(); render();
}

function downloadBackup(){
  const blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `jac-educa-respaldo-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Respaldo descargado', 'success');
}
function restoreBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.escuela || !data.classes){ toast('El archivo no parece un respaldo válido de JAC Educa', 'alert'); return; }
      STATE = data;
      if(STATE.esDemo===undefined) STATE.esDemo = isLegacyDemo(STATE);
      saveState();
      toast('Respaldo restaurado', 'success');
      render();
    }catch(err){ toast('No se pudo leer el archivo', 'alert'); }
  };
  reader.readAsText(file);
}

function fmtTimer(secs){
  secs = Math.max(0,secs);

  return `${m}:${s}`;
}

  const b = boardFor(classId); b.timerSecs = Math.max(0,b.timerSecs+delta); saveState(); render();
}
function toggleTimer(classId){
  const b = boardFor(classId);
  b.timerRunning = !b.timerRunning;

function resetTimer(classId){

}
function hookPizarron(){
  if(pizarronTimerInt) clearInterval(pizarronTimerInt);

    const route = currentRoute();
    if(route!=='#/pizarron') { clearInterval(pizarronTimerInt); return; }
    const classId = routeParam('clase') || STATE.classes[0].id;
    const b = boardFor(classId);
    if(b.timerRunning && b.timerSecs>0){
      b.timerSecs--;
      const el = document.getElementById('pz-timer-display');
      if(el) el.textContent = fmtTimer(b.timerSecs);
      if(b.timerSecs===0){ b.timerRunning=false; toast('⏱️ Tiempo terminado'); render(); }
      else saveState();
    }
  }, 1000);
}
function sortearAlumno(classId){
  const c = getClass(classId); const b = boardFor(classId);
  const disponibles = c.alumnos.filter(a=>!b.picked.includes(a.id));
  if(!disponibles.length){ toast('Todo el grupo ya participó'); return; }
  const chosen = disponibles[Math.floor(Math.random()*disponibles.length)];
  b.picked.push(chosen.id); b.lastPicked = chosen.id;
  saveState(); render();
}
function resetSorteo(classId){

function parseNames(text){

function addStudentsToClass(c, names){
  const existing = new Set(c.alumnos.map(a=>a.nombre.toLowerCase().replace(/\s+/g,' ')));
  let added=0;
  names.forEach(n=>{
    const nombre = n.replace(/\s+/g,' ').trim();
    if(!nombre || existing.has(nombre.toLowerCase())) return;
    existing.add(nombre.toLowerCase());
    c.alumnos.push({id:uid('al'), nombre, matricula:'', grupo:c.grupoCodigo});
    added++;
  });
  return added;
}

      <div class="field"><label>Materia de estos grupos</label><input id="im-materia" value="Geografía"></div>

      </div>
